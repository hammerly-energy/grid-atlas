schema_version: 2
country: US
market: ercot
name: ERCOT
coverage_note: Not all of Texas is in ERCOT; parts are in SPP, MISO and WECC (e.g. El Paso Electric, SPS, Entergy Texas).
bill_components: [generation, transmission, distribution, ancillary_uplift, riders_public_purpose]   # energy-only: no capacity

# Thin slice: competitive_area, residential class only (other classes are KNOWN_GAPS in test_claims.py).
base:
  nodes:
    - id: ferc
      name: FERC
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: Approves NERC reliability standards, which apply in ERCOT. No wholesale rate or market-rule jurisdiction over ERCOT (FPA 201(b)), which is not synchronously interconnected with the rest of the US; limited interconnection and wheeling-order authority (FPA 210, 211).
      domain_area:
        full: [lower48]
        partial: [ercot]
        partial_label: reliability only
        note: Contiguous US; inside ERCOT reliability standards apply, not FERC wholesale rate or market rules
        source: {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}
        status: needs_verification
    - id: nerc
      name: NERC
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Sets reliability standards approved by FERC; enforces them through regional entities.
      domain_area:
        full: [lower48, nerc_canada, mx_bcn]
        note: Contiguous US, most of Canada and northern Baja California (Mexico)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: texas_re
      name: Texas RE
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Texas Reliability Entity; NERC's regional entity for the ERCOT region.
      domain_area:
        full: [ercot]
        note: The ERCOT region (county-level approximation from EIA-861)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: puct
      name: PUCT
      lane: regulators
      kind: regulator
      jurisdiction: subnational
      description: Public Utility Commission of Texas; oversees ERCOT, sets transmission and distribution rates, certifies retail electric providers.
      domain_area:
        full: [tx]
        note: All of Texas, including areas outside ERCOT; city utilities and co-ops set their own retail rates
        source: {title: PURA chapter 32, url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.32.htm", accessed: "2026-10-07"}
        status: needs_verification
    - id: ercot
      name: ERCOT
      lane: market_operator
      kind: iso
      jurisdiction: subnational
      description: Operates the grid and the energy and ancillary service markets for about 90% of Texas load. Energy-only market; no capacity market. Owns no wires.
      domain_area:
        full: [ercot]
        note: Most of Texas; El Paso, the Panhandle and East Texas are outside (county-level approximation from EIA-861)
        source: {title: EIA-861 2025 service territories and balancing authorities, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-07"}
        status: needs_verification
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Sell energy into ERCOT's day-ahead and real-time markets.
      holds_assets: [generation]
      source: {title: EIA-860 generator inventory, url: "https://www.eia.gov/electricity/data/eia860/", accessed: "2026-10-07"}

archetypes:
  competitive_area:
    nodes:
      - id: tdsp
        name: TDSP
        slot: tdsp
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Wires-only utility. Owns and operates the local wires; may not sell electricity to retail customers.
        holds_assets: [transmission, distribution]
        source: &tdsplaw {title: "PURA § 39.105 (transmission and distribution utility may not sell electricity at retail)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.39.htm#39.105", accessed: "2026-10-08"}
      - id: rep
        name: REP
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: Customer-chosen retailer. Buys wholesale power, pays TDSP charges, bills the customer.
      - id: polr
        name: POLR provider
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: REP that serves customers whose REP defaults or leaves the market; ERCOT transfers them in a mass transition. Volunteer REPs charge a market-based month-to-month price; large service providers, designated by market share, charge at most a PUCT formula rate.
        source: &polr {title: "16 TAC § 25.43 Provider of Last Resort (POLR)", url: "https://www.law.cornell.edu/regulations/texas/16-Tex-Admin-Code-SS-25-43", accessed: "2026-10-08"}
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer in a competitive area (e.g. Oncor, CenterPoint).
      - id: small_commercial
        name: Small commercial
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Small business in a competitive area; picks a REP and pays the TDSP's small non-residential delivery rates.
      - id: large_ci
        name: Large commercial & industrial
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Large commercial or industrial site in a competitive area; demand-metered, usually on a negotiated REP contract.
      - id: large_load
        name: Large load
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Site of 75 MW or more, such as a data center, usually served at transmission voltage. SB 6 (2025) requires it to pay interconnection costs and study fees, disclose backup generation, and accept emergency curtailment if connected after 2025.
        source: &sb6 {title: "Texas SB 6 (89th Legislature, 2025), enrolled text", url: "https://capitol.texas.gov/tlodocs/89R/billtext/pdf/SB00006F.pdf", accessed: "2026-10-08"}
    edges:
      # regulation
      - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification,
         source: &fercercot {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}}
      - {id: nerc_texasre_rel, from: nerc, to: texas_re, type: regulates, domain: reliability, label: delegates enforcement, status: verified,
         source: &nerc {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}}
      - {id: texasre_ercot_rel, from: texas_re, to: ercot, type: regulates, domain: reliability, label: enforces reliability standards, status: verified, source: *nerc}
      - {id: puct_ercot, from: puct, to: ercot, type: regulates, domain: market_rules, label: approves ERCOT's rules and protocols, status: verified,
         source: &pura39 {title: "PURA § 39.151 (PUCT oversight of ERCOT)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.39.htm#39.151", accessed: "2026-10-08"}}
      - {id: puct_ercot_gov, from: puct, to: ercot, type: regulates, domain: governance, label: certifies ERCOT and approves its budget and administration fee, status: verified, source: *pura39}
      - {id: puct_rep_lic, from: puct, to: rep, type: regulates, domain: licensing, label: certifies retail electric providers, status: verified, source: {title: "PURA § 39.352 (REP certification)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.39.htm#39.352", accessed: "2026-10-08"}}
      - {id: puct_polr_lic, from: puct, to: polr, type: regulates, domain: licensing, label: designates large-service POLR providers by market share and lists volunteer REPs, status: verified, source: *polr}
      - {id: puct_polr_cap, from: puct, to: polr, type: sets_rate, mode: caps, label: "caps large-service POLR rates by formula (120-125% of the real-time price plus charges); volunteer REPs set market prices", status: verified, source: *polr}
      # operations
      - {id: ercot_dispatch, from: ercot, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification,
         source: &ercotops {title: ERCOT Retail 101, url: "https://www.ercot.com/files/docs/2026/03/06/2026_07-Retail-101.pdf", accessed: "2026-10-07"}}
      - {id: ercot_operates_tx, from: ercot, to: tdsp, type: operates, asset: transmission, label: directs operation of the transmission grid, status: needs_verification, source: *ercotops}
      # bill: generation (the REP buys at ERCOT prices under a PUCT offer cap, then sets its retail price)
      - {id: rep_ercot_energy, from: rep, to: ercot, type: pays, mode: market, rate_component: generation, label: buys energy at ERCOT settlement point prices, status: needs_verification, source: *ercotops}
      - {id: puct_ercot_cap, from: puct, to: ercot, type: sets_rate, mode: caps, rate_component: generation, label: sets the system-wide offer cap, status: verified,
         source: &offercap {title: "16 TAC § 25.505 Resource adequacy in ERCOT (system-wide offer cap)", url: "https://www.law.cornell.edu/regulations/texas/16-Tex-Admin-Code-SS-25-505", accessed: "2026-10-08"}}
      - {id: rep_res_gen, from: rep, to: residential, type: sets_rate, mode: sets, rate_component: generation, label: sets the energy price in its retail offer, status: needs_verification, source: *ercotops}
      # bill: transmission
      - {id: puct_tdsp_tx, from: puct, to: tdsp, type: sets_rate, mode: sets, rate_component: transmission, label: sets transmission rates, status: needs_verification,
         source: &tcos {title: 16 TAC 25.192 transmission rates, url: "https://ftp.puc.texas.gov/public/puct-info/agency/rulesnlaws/subrules/electric/25.192/21080pub.pdf", accessed: "2026-10-07"}}
      - {id: tdsp_rep_tx, from: tdsp, to: rep, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges to the REP, status: verified, source: &delivery {title: "16 TAC § 25.214 Terms and conditions of retail delivery service", url: "https://www.law.cornell.edu/regulations/texas/16-Tex-Admin-Code-SS-25-214", accessed: "2026-10-08"}}
      - {id: rep_res_tx, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: passes TDSP transmission charges to the customer, status: needs_verification, source: *ercotops}
      # bill: distribution
      - {id: puct_tdsp_dx, from: puct, to: tdsp, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in rate cases, status: verified, source: {title: PURA chapter 36 (rates), url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.36.htm", accessed: "2026-10-08"}}
      - {id: tdsp_rep_dx, from: tdsp, to: rep, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges to the REP, status: verified, source: *delivery}
      - {id: rep_res_dx, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: passes TDSP delivery charges to the customer, status: needs_verification, source: *ercotops}
      # bill: ancillary services
      - {id: ercot_rep_as, from: ercot, to: rep, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: charges ancillary service costs to the REP's scheduling entity by load ratio share, status: needs_verification, source: *ercotops}
      - {id: rep_res_as, from: rep, to: residential, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: bundles ancillary costs into its retail price, status: needs_verification, source: *ercotops}
      - {id: puct_ercot_fee, from: puct, to: ercot, type: sets_rate, mode: approves, rate_component: ancillary_uplift, subcomponent: ERCOT administration fee, label: approves the ERCOT system administration fee, status: verified, source: *pura39}
      # bill: riders
      - {id: puct_tdsp_rider, from: puct, to: tdsp, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency cost recovery), status: verified, source: {title: "16 TAC § 25.182 Energy efficiency cost recovery factor", url: "https://www.law.cornell.edu/regulations/texas/16-Tex-Admin-Code-SS-25-182", accessed: "2026-10-08"}}
      - {id: tdsp_rep_rider, from: tdsp, to: rep, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders to the REP, status: verified, source: *delivery}
      - {id: rep_res_rider, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: passes riders to the customer, status: needs_verification, source: *ercotops}
      # bill: small commercial, large commercial & industrial, large load (same setters as residential; last hop per class)
      - {id: rep_sc_gen, from: rep, to: small_commercial, type: sets_rate, mode: sets, rate_component: generation, label: sets the energy price in its retail contract, status: needs_verification, source: *ercotops}
      - {id: rep_sc_tx, from: rep, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: passes TDSP transmission charges to the customer, status: needs_verification, source: *ercotops}
      - {id: rep_sc_dx, from: rep, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: passes TDSP delivery charges to the customer, status: needs_verification, source: *ercotops}
      - {id: rep_sc_as, from: rep, to: small_commercial, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: bundles ancillary costs into its retail price, status: needs_verification, source: *ercotops}
      - {id: rep_sc_rider, from: rep, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: passes riders to the customer, status: needs_verification, source: *ercotops}
      - {id: rep_lci_gen, from: rep, to: large_ci, type: sets_rate, mode: sets, rate_component: generation, label: sets the energy price in its retail contract, status: needs_verification, source: *ercotops}
      - {id: rep_lci_tx, from: rep, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: "passes TDSP transmission charges (on demand at the four summer peaks for interval-metered customers)", status: needs_verification, source: &oncortariff {title: Oncor Tariff for Retail Delivery Service, url: "https://www.oncor.com/content/dam/oncorwww/documents/about-us/regulatory/tariff-and-rate-schedules/Tariff%20for%20Retail%20Delivery%20Service.pdf.coredownload.pdf", accessed: "2026-10-08"}}
      - {id: rep_lci_dx, from: rep, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: passes TDSP delivery charges to the customer, status: needs_verification, source: *ercotops}
      - {id: rep_lci_as, from: rep, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: passes ERCOT ancillary charges through (index contracts), status: needs_verification, source: *ercotops}
      - {id: rep_lci_rider, from: rep, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: passes riders to the customer, status: needs_verification, source: *ercotops}
      - {id: rep_ll_gen, from: rep, to: large_load, type: sets_rate, mode: sets, rate_component: generation, label: sets the energy price in its retail contract, status: needs_verification, source: *ercotops}
      - {id: rep_ll_tx, from: rep, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: "passes TDSP transmission charges (on demand at the four summer peaks; PUCT review under SB 6)", status: needs_verification, source: *oncortariff}
      - {id: rep_ll_dx, from: rep, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: passes the TDSP's delivery charges for its voltage level (transmission or primary), status: needs_verification, source: *ercotops}
      - {id: rep_ll_as, from: rep, to: large_load, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: passes ERCOT ancillary charges through (index contracts), status: needs_verification, source: *ercotops}
      - {id: rep_ll_rider, from: rep, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: passes riders to the customer, status: needs_verification, source: *ercotops}
      # large loads (75 MW or more): SB 6 (2025)
      - {id: puct_ll_sb6, from: puct, to: large_load, type: regulates, domain: reliability, label: "sets interconnection, disclosure and curtailment rules for loads of 75 MW or more, and approves co-location with existing generation (SB 6)", status: verified, source: *sb6}
      - {id: ercot_ll_sb6, from: ercot, to: large_load, type: regulates, domain: reliability, label: "under PUCT rules, can order backup generation (sites with 50% or more) or curtailment of loads connected after 2025 in an energy emergency (SB 6)", status: verified, source: *sb6}


  # Non-opt-in entity: a city-owned utility (or co-op) that has not opted in to retail competition. Its own governing
  # body sets retail rates; the PUCT keeps jurisdiction over wholesale transmission rates (PURA 40.004).
  noie:
    nodes:
      - id: governing_body
        name: Governing body
        slot: governing_body
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: Elected city council or utility board that approves the utility's retail rates. Ratepayers outside the city may appeal them to the PUCT (PURA 33.101).
        source: &cpsrates {title: San Antonio City Council approves CPS Energy's rate request, url: "https://newsroom.cpsenergy.com/san-antonio-city-council-approves-cps-energys-rate-request/", accessed: "2026-10-08"}
        status: needs_verification
      - id: noie
        name: NOIE
        slot: noie
        lane: retail
        kind: muni
        jurisdiction: local
        description: City-owned utility outside retail competition. Owns generation and wires and is the only seller to customers in its area.
        holds_assets: [generation, transmission, distribution]
        source: &pura40 {title: "PURA § 40.004 (PUCT jurisdiction over municipally owned utilities)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.40.htm#40.004", accessed: "2026-10-08"}
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer of a non-opt-in city-owned utility. It has no choice of retailer.
      - id: small_commercial
        name: Small commercial
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Small business served by a non-opt-in city-owned utility. It has no choice of retailer.
      - id: large_ci
        name: Large commercial & industrial
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Large commercial or industrial customer of a non-opt-in city-owned utility, on a demand-metered rate class.
      - id: large_load
        name: Large load
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Site of 75 MW or more, such as a data center, served by a non-opt-in city-owned utility. SB 6 (2025) also applies here; the utility passes reasonable interconnection costs to it (PURA 35.004) and may add its own requirements.
        source: *sb6
    edges:
      # regulation
      - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification, source: *fercercot}
      - {id: nerc_texasre_rel, from: nerc, to: texas_re, type: regulates, domain: reliability, label: delegates enforcement, status: verified, source: *nerc}
      - {id: texasre_ercot_rel, from: texas_re, to: ercot, type: regulates, domain: reliability, label: enforces reliability standards, status: verified, source: *nerc}
      - {id: puct_ercot, from: puct, to: ercot, type: regulates, domain: market_rules, label: approves ERCOT's rules and protocols, status: verified, source: *pura39}
      - {id: puct_ercot_gov, from: puct, to: ercot, type: regulates, domain: governance, label: certifies ERCOT and approves its budget and administration fee, status: verified, source: *pura39}
      - {id: gov_noie_gov, from: governing_body, to: noie, type: regulates, domain: governance, label: governs the utility and approves its rates, status: needs_verification, source: *cpsrates}
      - {id: puct_noie_appeal, from: puct, to: governing_body, type: regulates, domain: rates, label: hears rate appeals by ratepayers outside the city (PURA 33.101), status: verified,
         source: {title: "PURA § 33.101 (appeal of municipal rate decisions)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.33.htm#33.101", accessed: "2026-10-08"}}
      - {id: puct_noie_cert, from: puct, to: noie, type: regulates, domain: licensing, label: certificates the utility's service area, status: verified, source: *pura40}
      # operations
      - {id: ercot_dispatch, from: ercot, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *ercotops}
      - {id: ercot_operates_tx_noie, from: ercot, to: noie, type: operates, asset: transmission, label: directs operation of the transmission the utility owns, status: needs_verification, source: *ercotops}
      # bill: the governing body sets generation, distribution and riders
      - {id: noie_ercot_energy, from: noie, to: ercot, type: pays, mode: market, rate_component: generation, label: settles energy bought and sold at ERCOT prices, status: needs_verification, source: *ercotops}
      - {id: gov_noie_gen, from: governing_body, to: noie, type: sets_rate, mode: approves, rate_component: generation, label: approves the base generation rate and the fuel cost recovery formula, status: needs_verification, source: *cpsrates}
      - {id: noie_res_gen, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *cpsrates}
      - {id: gov_noie_dx, from: governing_body, to: noie, type: sets_rate, mode: sets, rate_component: distribution, label: approves distribution charges, status: needs_verification, source: *cpsrates}
      - {id: noie_res_dx, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *cpsrates}
      - {id: gov_noie_rider, from: governing_body, to: noie, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: approves riders and program charges, status: needs_verification, source: *cpsrates}
      - {id: noie_res_rider, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *cpsrates}
      # bill: the PUCT still sets wholesale transmission rates; ERCOT prices ancillary services
      - {id: puct_noie_tx, from: puct, to: noie, type: sets_rate, mode: sets, rate_component: transmission, label: sets the wholesale transmission rate the utility pays and the rate for its own transmission, status: verified, source: *pura40}
      - {id: noie_res_tx, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *cpsrates}
      - {id: noie_ercot_as, from: noie, to: ercot, type: pays, mode: market, rate_component: ancillary_uplift, label: pays ERCOT ancillary service charges at market prices, status: needs_verification, source: *ercotops}
      - {id: gov_noie_as, from: governing_body, to: noie, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: approves recovery of ancillary costs in retail rates, status: needs_verification, source: *cpsrates}
      - {id: noie_res_as, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      # bill: small commercial, large commercial & industrial, large load (same setters as residential; last hop per class)
      - {id: noie_sc_gen, from: noie, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *cpsrates}
      - {id: noie_sc_tx, from: noie, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *cpsrates}
      - {id: noie_sc_dx, from: noie, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *cpsrates}
      - {id: noie_sc_as, from: noie, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      - {id: noie_sc_rider, from: noie, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *cpsrates}
      - {id: noie_lci_gen, from: noie, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *cpsrates}
      - {id: noie_lci_tx, from: noie, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *cpsrates}
      - {id: noie_lci_dx, from: noie, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *cpsrates}
      - {id: noie_lci_as, from: noie, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      - {id: noie_lci_rider, from: noie, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *cpsrates}
      - {id: noie_ll_gen, from: noie, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *cpsrates}
      - {id: noie_ll_tx, from: noie, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *cpsrates}
      - {id: noie_ll_dx, from: noie, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges for its voltage level (transmission or primary), status: needs_verification, source: *cpsrates}
      - {id: noie_ll_as, from: noie, to: large_load, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      - {id: noie_ll_rider, from: noie, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *cpsrates}
      # large loads (75 MW or more): SB 6 (2025)
      - {id: gov_ll_sb6, from: governing_body, to: large_load, type: regulates, domain: policy_standard, label: may add its own interconnection requirements (SB 6), status: verified, source: *sb6}
      - {id: puct_ll_sb6, from: puct, to: large_load, type: regulates, domain: reliability, label: "sets interconnection, disclosure and curtailment rules for loads of 75 MW or more, and approves co-location with existing generation (SB 6)", status: verified, source: *sb6}
      - {id: ercot_ll_sb6, from: ercot, to: large_load, type: regulates, domain: reliability, label: "under PUCT rules, can order backup generation (sites with 50% or more) or curtailment of loads connected after 2025 in an energy emergency (SB 6)", status: verified, source: *sb6}

  # Electric cooperative outside retail competition (almost all ERCOT co-ops; Nueces EC opted in). Owned by its members,
  # who elect the board; the board sets retail rates. The PUCT's jurisdiction over a co-op is limited to wholesale
  # transmission rates and service, certification and a few other items (PURA 41.004).
  coop:
    nodes:
      - id: coop_board
        name: Board of directors
        slot: coop_board
        lane: regulators
        kind: legislature
        jurisdiction: private
        description: Corporate board elected by the co-op's members, not a public body. Approves the co-op's retail rates; the PUCT does not.
        source: &pecrates {title: Pedernales Electric Cooperative rate policy, url: "https://mypec.com/wp-content/uploads/2023/11/Rate-Policy.pdf", accessed: "2026-10-08"}
        status: needs_verification
      - id: coop
        name: Co-op
        slot: coop
        lane: retail
        kind: coop
        jurisdiction: private
        description: Member-owned distribution utility outside retail competition. Owns the local wires, buys wholesale power and is the only seller to customers in its area.
        holds_assets: [distribution]
        source: &pura41 {title: "PURA § 41.004 (PUCT jurisdiction over electric cooperatives)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.41.htm", accessed: "2026-10-08"}
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household member of a co-op that has not opted in to retail competition. It has no choice of retailer.
      - id: small_commercial
        name: Small commercial
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Small business member of a co-op that has not opted in to retail competition.
      - id: large_ci
        name: Large commercial & industrial
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Large commercial or industrial member of a co-op, on a demand-metered rate class.
      - id: large_load
        name: Large load
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Site of 75 MW or more, such as a data center, served by a co-op. SB 6 (2025) also applies here; the co-op passes reasonable interconnection costs to it (PURA 35.004) and may add its own requirements.
        source: *sb6
    edges:
      # regulation
      - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification, source: *fercercot}
      - {id: nerc_texasre_rel, from: nerc, to: texas_re, type: regulates, domain: reliability, label: delegates enforcement, status: verified, source: *nerc}
      - {id: texasre_ercot_rel, from: texas_re, to: ercot, type: regulates, domain: reliability, label: enforces reliability standards, status: verified, source: *nerc}
      - {id: puct_ercot, from: puct, to: ercot, type: regulates, domain: market_rules, label: approves ERCOT's rules and protocols, status: verified, source: *pura39}
      - {id: puct_ercot_gov, from: puct, to: ercot, type: regulates, domain: governance, label: certifies ERCOT and approves its budget and administration fee, status: verified, source: *pura39}
      - {id: board_coop_gov, from: coop_board, to: coop, type: regulates, domain: governance, label: governs the co-op and approves its rates, status: verified, source: *pecrates}
      - {id: puct_coop_cert, from: puct, to: coop, type: regulates, domain: licensing, label: certificates the co-op's service area, status: verified, source: *pura41}
      # operations
      - {id: ercot_dispatch, from: ercot, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *ercotops}
      # bill: the board sets generation, distribution and riders
      - {id: board_coop_gen, from: coop_board, to: coop, type: sets_rate, mode: approves, rate_component: generation, label: approves the power cost recovery formula that passes through wholesale power costs, status: needs_verification, source: *pecrates}
      - {id: coop_res_gen, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the power cost charge, status: needs_verification, source: *pecrates}
      - {id: board_coop_dx, from: coop_board, to: coop, type: sets_rate, mode: sets, rate_component: distribution, label: approves delivery charges, status: needs_verification, source: *pecrates}
      - {id: coop_res_dx, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges, status: needs_verification, source: *pecrates}
      - {id: board_coop_rider, from: coop_board, to: coop, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: approves riders and program charges, status: needs_verification, source: *pecrates}
      - {id: coop_res_rider, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pecrates}
      # bill: the PUCT still sets wholesale transmission rates; ERCOT prices ancillary services
      - {id: puct_coop_tx, from: puct, to: coop, type: sets_rate, mode: sets, rate_component: transmission, label: sets the wholesale transmission rate the co-op pays, status: needs_verification, source: *tcos}
      - {id: coop_res_tx, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *pecrates}
      - {id: coop_ercot_as, from: coop, to: ercot, type: pays, mode: market, rate_component: ancillary_uplift, label: bears ERCOT ancillary service charges at market prices (directly or through its wholesale supplier), status: needs_verification, source: *ercotops}
      - {id: board_coop_as, from: coop_board, to: coop, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: approves recovery of ancillary costs in retail rates, status: needs_verification, source: *pecrates}
      - {id: coop_res_as, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      # bill: small commercial, large commercial & industrial, large load (same setters as residential; last hop per class)
      - {id: coop_sc_gen, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the power cost charge, status: needs_verification, source: *pecrates}
      - {id: coop_sc_tx, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *pecrates}
      - {id: coop_sc_dx, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges, status: needs_verification, source: *pecrates}
      - {id: coop_sc_as, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      - {id: coop_sc_rider, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pecrates}
      - {id: coop_lci_gen, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the power cost charge, status: needs_verification, source: *pecrates}
      - {id: coop_lci_tx, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *pecrates}
      - {id: coop_lci_dx, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges, status: needs_verification, source: *pecrates}
      - {id: coop_lci_as, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      - {id: coop_lci_rider, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pecrates}
      - {id: coop_ll_gen, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the power cost charge, status: needs_verification, source: *pecrates}
      - {id: coop_ll_tx, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *pecrates}
      - {id: coop_ll_dx, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges for its voltage level (transmission or primary), status: needs_verification, source: *pecrates}
      - {id: coop_ll_as, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}
      - {id: coop_ll_rider, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pecrates}
      # large loads (75 MW or more): SB 6 (2025)
      - {id: board_ll_sb6, from: coop_board, to: large_load, type: regulates, domain: policy_standard, label: may add its own interconnection requirements (SB 6), status: verified, source: *sb6}
      - {id: puct_ll_sb6, from: puct, to: large_load, type: regulates, domain: reliability, label: "sets interconnection, disclosure and curtailment rules for loads of 75 MW or more, and approves co-location with existing generation (SB 6)", status: needs_verification, source: *sb6}
      - {id: ercot_ll_sb6, from: ercot, to: large_load, type: regulates, domain: reliability, label: "under PUCT rules, can order backup generation (sites with 50% or more) or curtailment of loads connected after 2025 in an energy emergency (SB 6)", status: needs_verification, source: *sb6}

