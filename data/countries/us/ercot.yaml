schema_version: 2
country: US
market: ercot
name: ERCOT
coverage_note: Not all of Texas is in ERCOT; parts are in SPP, MISO and WECC (e.g. El Paso Electric, SPS, Entergy Texas).
bill_components: [generation, transmission, distribution, ancillary_uplift, riders_public_purpose]   # energy-only: no capacity

# Thin slice: competitive_area, residential class only (other classes are KNOWN_GAPS in test_claims.py).
base:
  nodes:
    - id: ferc
      name: FERC
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: Approves NERC reliability standards. No rate or market-rule jurisdiction over ERCOT, which is not synchronously interconnected with the rest of the US.
      domain_area:
        full: [lower48]
        partial: [ercot]
        partial_label: reliability only
        note: Contiguous US; inside ERCOT only reliability standards apply, not wholesale rates or market rules
        source: {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}
        status: needs_verification
    - id: nerc
      name: NERC
      lane: regulators
      kind: reliability_body
      jurisdiction: national
      description: Sets reliability standards approved by FERC; enforces them through regional entities.
      domain_area:
        full: [lower48, canada]
        note: Contiguous US, most of Canada and northern Baja California (Mexico)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: texas_re
      name: Texas RE
      lane: regulators
      kind: reliability_body
      jurisdiction: subnational
      description: Texas Reliability Entity; NERC's regional entity for the ERCOT region.
      domain_area:
        full: [ercot]
        note: The ERCOT region (county-level approximation from EIA-861)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: puct
      name: PUCT
      lane: regulators
      kind: regulator
      jurisdiction: subnational
      description: Public Utility Commission of Texas; oversees ERCOT, sets transmission and distribution rates, licenses retail electric providers.
      domain_area:
        full: [tx]
        note: All of Texas, including areas outside ERCOT; city-owned utilities and co-ops set their own retail rates
        source: {title: PURA chapter 32, url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.32.htm", accessed: "2026-10-07"}
        status: needs_verification
    - id: ercot
      name: ERCOT
      lane: market_operator
      kind: iso
      jurisdiction: subnational
      description: Operates the grid and the energy and ancillary service markets for about 90% of Texas load. Energy-only market; no capacity market. Owns no wires.
      domain_area:
        full: [ercot]
        note: Most of Texas; El Paso, the Panhandle and East Texas are outside (county-level approximation from EIA-861)
        source: {title: EIA-861 2025 service territories and balancing authorities, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-07"}
        status: needs_verification
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Sell energy into ERCOT's day-ahead and real-time markets.
      holds_assets: [generation]
      source: {title: EIA-860 generator inventory, url: "https://www.eia.gov/electricity/data/eia860/", accessed: "2026-10-07"}

archetypes:
  competitive_area:
    nodes:
      - id: tdsp
        name: TDSP
        slot: tdsp
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Wires-only utility. Owns and operates the local wires; may not sell electricity to retail customers.
        holds_assets: [transmission, distribution]
        source: &puct {title: Public Utility Commission of Texas, url: "https://www.puc.texas.gov", accessed: "2026-10-07"}
      - id: rep
        name: REP
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: Customer-chosen retailer. Buys wholesale power, pays TDSP charges, bills the customer.
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer in a competitive area (e.g. Oncor, CenterPoint).
    edges:
      # regulation
      - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification,
         source: &fercercot {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}}
      - {id: nerc_texasre_rel, from: nerc, to: texas_re, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification,
         source: &nerc {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}}
      - {id: texasre_ercot_rel, from: texas_re, to: ercot, type: regulates, domain: reliability, label: enforces reliability standards, status: needs_verification, source: *nerc}
      - {id: puct_ercot, from: puct, to: ercot, type: regulates, domain: market_rules, label: oversees ERCOT and approves its protocols, status: needs_verification,
         source: &pura39 {title: PURA chapter 39, url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.39.htm", accessed: "2026-10-07"}}
      - {id: puct_rep_lic, from: puct, to: rep, type: regulates, domain: licensing, label: certifies retail electric providers, status: needs_verification, source: *pura39}
      # operations
      - {id: ercot_dispatch, from: ercot, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification,
         source: &ercotops {title: ERCOT Retail 101, url: "https://www.ercot.com/files/docs/2026/03/06/2026_07-Retail-101.pdf", accessed: "2026-10-07"}}
      - {id: ercot_operates_tx, from: ercot, to: tdsp, type: operates, asset: transmission, label: directs operation of the transmission grid, status: needs_verification, source: *ercotops}
      # bill: generation
      - {id: rep_res_gen, from: rep, to: residential, type: sets_rate, mode: sets, rate_component: generation, label: sets the energy price in its retail offer, status: needs_verification, source: *ercotops}
      # bill: transmission
      - {id: puct_tdsp_tx, from: puct, to: tdsp, type: sets_rate, mode: sets, rate_component: transmission, label: sets transmission rates, status: needs_verification,
         source: &tcos {title: 16 TAC 25.192 transmission rates, url: "https://ftp.puc.texas.gov/public/puct-info/agency/rulesnlaws/subrules/electric/25.192/21080pub.pdf", accessed: "2026-10-07"}}
      - {id: tdsp_rep_tx, from: tdsp, to: rep, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges to the REP, status: needs_verification, source: *puct}
      - {id: rep_res_tx, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: passes TDSP transmission charges to the customer, status: needs_verification, source: *ercotops}
      # bill: distribution
      - {id: puct_tdsp_dx, from: puct, to: tdsp, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in rate cases, status: needs_verification, source: *puct}
      - {id: tdsp_rep_dx, from: tdsp, to: rep, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges to the REP, status: needs_verification, source: *puct}
      - {id: rep_res_dx, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: passes TDSP delivery charges to the customer, status: needs_verification, source: *ercotops}
      # bill: ancillary services
      - {id: ercot_rep_as, from: ercot, to: rep, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: allocates ancillary service costs at market-cleared prices, status: needs_verification, source: *ercotops}
      - {id: rep_res_as, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in the retail price, status: needs_verification, source: *ercotops}
      # bill: riders
      - {id: puct_tdsp_rider, from: puct, to: tdsp, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency cost recovery), status: needs_verification, source: *puct}
      - {id: tdsp_rep_rider, from: tdsp, to: rep, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders to the REP, status: needs_verification, source: *puct}
      - {id: rep_res_rider, from: rep, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: passes riders to the customer, status: needs_verification, source: *ercotops}


  # Non-opt-in entity: a city-owned utility (or co-op) that has not opted in to retail competition. Its own governing
  # body sets retail rates; the PUCT keeps jurisdiction over wholesale transmission rates (PURA 40.004).
  noie:
    nodes:
      - id: governing_body
        name: Governing body
        slot: governing_body
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: Elected city council or utility board that approves the utility's retail rates. The PUCT does not.
        source: &cpsrates {title: San Antonio City Council approves CPS Energy's rate request, url: "https://newsroom.cpsenergy.com/san-antonio-city-council-approves-cps-energys-rate-request/", accessed: "2026-10-08"}
        status: needs_verification
      - id: noie
        name: NOIE
        slot: noie
        lane: retail
        kind: muni
        jurisdiction: local
        description: City-owned utility outside retail competition. Owns generation and wires and is the only seller to customers in its area.
        holds_assets: [generation, transmission, distribution]
        source: *cpsrates
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer of a non-opt-in city-owned utility. It has no choice of retailer.
    edges:
      # regulation
      - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification, source: *fercercot}
      - {id: nerc_texasre_rel, from: nerc, to: texas_re, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
      - {id: texasre_ercot_rel, from: texas_re, to: ercot, type: regulates, domain: reliability, label: enforces reliability standards, status: needs_verification, source: *nerc}
      - {id: puct_ercot, from: puct, to: ercot, type: regulates, domain: market_rules, label: oversees ERCOT and approves its protocols, status: needs_verification, source: *pura39}
      - {id: gov_noie_gov, from: governing_body, to: noie, type: regulates, domain: governance, label: governs the utility and approves its rates, status: needs_verification, source: *cpsrates}
      # operations
      - {id: ercot_dispatch, from: ercot, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *ercotops}
      - {id: ercot_operates_tx_noie, from: ercot, to: noie, type: operates, asset: transmission, label: directs operation of the transmission the utility owns, status: needs_verification, source: *ercotops}
      # bill: the governing body sets generation, distribution and riders
      - {id: gov_noie_gen, from: governing_body, to: noie, type: sets_rate, mode: sets, rate_component: generation, label: approves the generation and fuel rates, status: needs_verification, source: *cpsrates}
      - {id: noie_res_gen, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *cpsrates}
      - {id: gov_noie_dx, from: governing_body, to: noie, type: sets_rate, mode: sets, rate_component: distribution, label: approves distribution charges, status: needs_verification, source: *cpsrates}
      - {id: noie_res_dx, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *cpsrates}
      - {id: gov_noie_rider, from: governing_body, to: noie, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: approves riders and program charges, status: needs_verification, source: *cpsrates}
      - {id: noie_res_rider, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *cpsrates}
      # bill: the PUCT still sets wholesale transmission rates; ERCOT prices ancillary services
      - {id: puct_noie_tx, from: puct, to: noie, type: sets_rate, mode: sets, rate_component: transmission, label: sets wholesale transmission rates the utility pays and charges, status: needs_verification,
         source: {title: PURA chapter 40 (PUCT jurisdiction over municipal wholesale transmission rates), url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.40.htm", accessed: "2026-10-08"}}
      - {id: noie_res_tx, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *cpsrates}
      - {id: ercot_noie_as, from: ercot, to: noie, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: allocates ancillary service costs at market-cleared prices, status: needs_verification, source: *ercotops}
      - {id: noie_res_as, from: noie, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}

  # Electric cooperative outside retail competition (almost all ERCOT co-ops; Nueces EC opted in). Owned by its members,
  # who elect the board; the board sets retail rates. The PUCT's jurisdiction over a co-op is limited to wholesale
  # transmission rates and service, certification and a few other items (PURA 41.004).
  coop:
    nodes:
      - id: coop_board
        name: Board of directors
        slot: coop_board
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: Board elected by the co-op's members. Approves the co-op's retail rates; the PUCT does not.
        source: &pecrates {title: Pedernales Electric Cooperative rate policy, url: "https://mypec.com/wp-content/uploads/2023/11/Rate-Policy.pdf", accessed: "2026-10-08"}
        status: needs_verification
      - id: coop
        name: Co-op
        slot: coop
        lane: retail
        kind: coop
        jurisdiction: local
        description: Member-owned distribution utility outside retail competition. Owns the local wires, buys wholesale power and is the only seller to customers in its area.
        holds_assets: [distribution]
        source: &pura41 {title: "PURA § 41.004 (PUCT jurisdiction over electric cooperatives)", url: "https://statutes.capitol.texas.gov/Docs/UT/htm/UT.41.htm", accessed: "2026-10-08"}
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household member of a co-op that has not opted in to retail competition. It has no choice of retailer.
    edges:
      # regulation
      - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification, source: *fercercot}
      - {id: nerc_texasre_rel, from: nerc, to: texas_re, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
      - {id: texasre_ercot_rel, from: texas_re, to: ercot, type: regulates, domain: reliability, label: enforces reliability standards, status: needs_verification, source: *nerc}
      - {id: puct_ercot, from: puct, to: ercot, type: regulates, domain: market_rules, label: oversees ERCOT and approves its protocols, status: needs_verification, source: *pura39}
      - {id: board_coop_gov, from: coop_board, to: coop, type: regulates, domain: governance, label: governs the co-op and approves its rates, status: needs_verification, source: *pecrates}
      - {id: puct_coop_cert, from: puct, to: coop, type: regulates, domain: licensing, label: certificates the co-op's service area, status: needs_verification, source: *pura41}
      # operations
      - {id: ercot_dispatch, from: ercot, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *ercotops}
      # bill: the board sets generation, distribution and riders
      - {id: board_coop_gen, from: coop_board, to: coop, type: sets_rate, mode: sets, rate_component: generation, label: approves the power cost charge, status: needs_verification, source: *pecrates}
      - {id: coop_res_gen, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the power cost charge, status: needs_verification, source: *pecrates}
      - {id: board_coop_dx, from: coop_board, to: coop, type: sets_rate, mode: sets, rate_component: distribution, label: approves delivery charges, status: needs_verification, source: *pecrates}
      - {id: coop_res_dx, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills delivery charges, status: needs_verification, source: *pecrates}
      - {id: board_coop_rider, from: coop_board, to: coop, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: approves riders and program charges, status: needs_verification, source: *pecrates}
      - {id: coop_res_rider, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pecrates}
      # bill: the PUCT still sets wholesale transmission rates; ERCOT prices ancillary services
      - {id: puct_coop_tx, from: puct, to: coop, type: sets_rate, mode: sets, rate_component: transmission, label: sets wholesale transmission rates the co-op pays and charges, status: needs_verification, source: *pura41}
      - {id: coop_res_tx, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: recovers transmission cost in retail rates, status: needs_verification, source: *pecrates}
      - {id: ercot_coop_as, from: ercot, to: coop, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: allocates ancillary service costs at market-cleared prices, status: needs_verification, source: *ercotops}
      - {id: coop_res_as, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *ercotops}

utilities:
  Oncor:
    area: TX
    archetypes: [competitive_area]
    fills:
      tdsp:
        name: Oncor
        domain_area: {full: [oncor], note: "Oncor service territory, north, central and west Texas", source: &hifld {title: HIFLD Electric Retail Service Territories (archived), url: "https://source.coop/seerai/hifld/electric-retail-service-territories", accessed: "2026-10-08"}, status: needs_verification}
  CenterPoint:
    area: TX
    archetypes: [competitive_area]
    fills:
      tdsp:
        name: CenterPoint Energy
        domain_area: {full: [centerpoint], note: "CenterPoint service territory, the Houston area", source: *hifld, status: needs_verification}
  CPS Energy:
    area: TX
    archetypes: [noie]
    fills:
      governing_body: {name: San Antonio City Council}
      noie:
        name: CPS Energy
        owner: {name: City of San Antonio, type: municipal, as_of: "2026-10-08", source: *cpsrates}
        domain_area: {full: [cps], note: "CPS Energy service territory, San Antonio and Bexar County area", source: *hifld, status: needs_verification}
  Pedernales Electric Cooperative:
    area: TX
    archetypes: [coop]
    fills:
      coop_board: {name: PEC board}
      coop:
        name: PEC
        owner: {name: Its members, type: cooperative, as_of: "2026-10-08", source: *pecrates}
        domain_area: {full: [pec], note: "Pedernales Electric Cooperative territory, Texas Hill Country around Austin and San Antonio", source: *hifld, status: needs_verification}
  CoServ:
    area: TX
    archetypes: [coop]
    fills:
      coop_board: {name: CoServ board}
      coop:
        name: CoServ Electric
        owner: {name: Its members, type: cooperative, as_of: "2026-10-08", source: {title: About CoServ, url: "https://coserv.com/about", accessed: "2026-10-08"}}
        domain_area: {full: [coserv], note: "CoServ territory, Denton County and neighboring North Texas counties", source: *hifld, status: needs_verification}
