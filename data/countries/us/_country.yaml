  wholesale:       {title: WHOLESALE & TRANSMISSION,  subtitle: generators · storage · transmission owners · LSEs}
  retail:          {title: DISTRIBUTION & RETAIL,     subtitle: wires utility · retail provider / CCA / muni / co-op}
  consumers:       {title: CONSUMERS,                 subtitle: residential · small commercial · large commercial & industrial · large load}
jurisdiction_labels: {supranational: Multi-state, national: Federal, subnational: State, local: Local, private: Private}
