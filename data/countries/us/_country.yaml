  regulators:      {title: POLICY & REGULATION,       subtitle: FERC · NERC / regional entity · state PUC · legislature}
  market_operator: {title: SYSTEM & MARKET OPERATION, subtitle: "ISO/RTO (energy, capacity, ancillary, planning)"}
  wholesale:       {title: WHOLESALE & TRANSMISSION,  subtitle: generators · storage · transmission owners · LSEs}
  retail:          {title: DISTRIBUTION & RETAIL,     subtitle: wires utility · retail provider / CCA / muni / co-op}
  consumers:       {title: CONSUMERS,                 subtitle: residential · small commercial · large commercial & industrial · large load}
jurisdiction_labels: {national: Federal, subnational: State, local: Local, private: Private}
kind_labels:
  iso: ISO / RTO
  wires_utility: Investor-owned utility (IOU)
  retail_provider: Retail provider (REP / ESP)
  reliability_body: NERC / regional entity
  muni: Publicly owned utility (POU)
  system_operator: Balancing authority (BA)
  legislature: Elected governing body
component_labels:
  generation: Generation
