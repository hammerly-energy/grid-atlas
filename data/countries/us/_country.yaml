glossary:
  ISO/RTO: {term: ISO / RTO, meaning: Independent System Operator / Regional Transmission Organization; operates the grid and wholesale markets and owns no wires., equivalent: {GB: NESO (system operation only; no energy market)}}
  BA: {term: BA, meaning: Balancing authority; balances load and generation within its area.}
  FERC: {term: FERC, meaning: Federal Energy Regulatory Commission; regulates wholesale markets and interstate transmission., equivalent: {GB: Ofgem (wholesale and network side)}}
  NERC: {term: NERC, meaning: North American Electric Reliability Corporation; sets reliability standards approved by FERC and enforced through regional entities.}
  WECC: {term: WECC, meaning: "Western Electricity Coordinating Council; NERC regional entity for the Western Interconnection."}
  SERC: {term: SERC, meaning: "SERC Reliability Corporation; NERC regional entity for the southeastern US."}
  PUC: {term: PUC / PUCT / CPUC, meaning: State utility commission (generic / Texas / California)., equivalent: {GB: Ofgem (retail and distribution side)}}
  IOU: {term: IOU, meaning: Investor-owned utility.}
  Muni / co-op: {term: Muni / co-op, meaning: City-owned / member-owned utility.}
  LSE: {term: LSE, meaning: Load-serving entity; buys wholesale power for end customers., equivalent: {GB: Supplier (as a BSC party)}}
  ERCOT: {term: ERCOT, meaning: "Electric Reliability Council of Texas; the ISO for about 90% of Texas load, outside FERC rate and market-rule jurisdiction."}
  PJM: {term: PJM, meaning: "PJM Interconnection; the RTO for all or parts of 13 states and the District of Columbia."}
  CAISO: {term: CAISO, meaning: California Independent System Operator; the ISO for most of California.}
  REP: {term: REP, meaning: Retail electric provider (ERCOT term)., equivalent: {GB: Supplier}}
  TDSP / EDC: {term: TDSP / EDC, meaning: Wires-only utility (ERCOT term / PA term)., equivalent: {GB: DNO}}
  NOIE: {term: NOIE, meaning: Non-opt-in entity; an ERCOT municipal utility or co-op that has not opted in to retail competition.}
  CCA: {term: CCA, meaning: Community Choice Aggregation; a city or county buys power for residents by default while the IOU keeps wires and billing.}
  PCIA: {term: PCIA, meaning: Power Charge Indifference Adjustment; California exit fee paid by CCA and Direct Access customers.}
  DA / ESP: {term: DA / ESP, meaning: Direct Access / Electric Service Provider (California).}
  RA: {term: RA, meaning: "Resource adequacy; California's capacity obligation on LSEs, set by the CPUC and munis (no central auction)."}
  Default service: {term: Default service, meaning: Supply for customers who don't pick a retailer in restructured states., equivalent: {GB: Default tariff (price-capped)}}
  POU: {term: POU, meaning: "Publicly owned utility: a city department, utility district or irrigation district. Its elected board or council sets its rates, not the state PUC."}
  WEIM: {term: WEIM, meaning: "Western Energy Imbalance Market; CAISO's real-time market that balancing authorities outside CAISO can join."}
  BANC: {term: BANC, meaning: "Balancing Authority of Northern California; a joint powers authority of SMUD and other POUs. SMUD operates it under contract."}
  SMUD: {term: SMUD, meaning: "Sacramento Municipal Utility District; a public agency (POU) governed by a seven-member board elected by voters in its district."}
  LADWP: {term: LADWP, meaning: "Los Angeles Department of Water and Power; the City of Los Angeles' POU and its own balancing authority."}
  Co-op: {term: Co-op, meaning: "Electric cooperative: a utility owned by its customers (members), who elect its board. Texas co-op boards set their own rates; Virginia's SCC still approves co-op rates."}
  NOVEC: {term: NOVEC, meaning: "Northern Virginia Electric Cooperative; a member-owned distribution co-op in the PJM region."}
  ICC: {term: ICC, meaning: "Illinois Commerce Commission; sets ComEd's distribution rates and oversees default service."}
  PEC: {term: PEC, meaning: "Pedernales Electric Cooperative; the largest US distribution co-op by customers (EIA-861), in the Texas Hill Country (ERCOT)."}
  REC: {term: REC, meaning: "Rappahannock Electric Cooperative; a member-owned distribution co-op in central and northern Virginia (PJM)."}
  SCC: {term: SCC, meaning: "Virginia State Corporation Commission; sets the bundled retail rates of Virginia's investor-owned utilities."}
  POLR: {term: POLR, meaning: "Provider of last resort; a REP the PUCT designates to take customers whose REP defaults or exits. The PUCT caps the large-service providers' rate (16 TAC 25.43)."}
  SB 6: {term: SB 6, meaning: "Texas Senate Bill 6 (2025); rules for loads of 75 MW or more: interconnection fees and disclosures, ERCOT emergency curtailment, PUCT review of transmission cost allocation."}
