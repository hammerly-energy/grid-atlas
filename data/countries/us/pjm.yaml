      - {id: viu_ll_rider, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *wv}

  # Vertically integrated with limited retail choice (Virginia): one utility owns generation and wires and the state
  # commission sets bundled rates. Only customers above 5 MW may shop (Va. Code 56-577), so the diagram shows the
  # utility's own supply for every class.
  limited_choice:
    label: Vertically integrated (choice above 5 megawatts)
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State commission that sets the utility's bundled retail rates, including generation.
        source: &va585 {title: "Va. Code § 56-585.1 (SCC review of utility rates)", url: "https://law.lis.virginia.gov/vacode/title56/chapter23/section56-585.1/", accessed: "2026-10-08"}
        status: needs_verification
      - id: serc
        name: SERC
        lane: regulators
        kind: reliability_body
        jurisdiction: private
        description: NERC's regional entity for the southeastern US, including Virginia.
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}
        status: needs_verification
        domain_area:
          full: [re_serc]
          note: Counties whose utilities report SERC to EIA-861, including Florida (county-level approximation)
          source: {title: EIA-861 2025 NERC region by utility, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-08"}
          status: needs_verification
      - id: viu
        name: Vertically integrated utility
        slot: viu
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Owns generation, transmission and distribution and sells to residential customers, who cannot pick another supplier.
        holds_assets: [generation, transmission, distribution]
        source: *va585
        status: needs_verification
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: "Household customer of a vertically integrated utility. Only customers above 5 megawatts may buy from a competitive supplier, with narrow exceptions."}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: Small business on the utility's bundled rates.}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: Large customer on the utility's bundled rates. Above 5 megawatts it may buy from a licensed competitive supplier instead (Va. Code 56-577).}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center, shown on the utility's bundled rates. Above 5 megawatts it may buy from a licensed competitive supplier instead (Va. Code 56-577)."}
    edges:
      - {id: nerc_serc_rel, from: nerc, to: serc, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
      - {id: serc_viu_rel, from: serc, to: viu, type: regulates, domain: reliability, label: enforces reliability standards on the utility's transmission, status: needs_verification, source: *nerc}
      - {id: puc_viu, from: state_puc, to: viu, type: regulates, domain: rates, label: regulates bundled retail rates, status: needs_verification, source: *va585}
      - {id: pjm_operates_tx_viu, from: pjm, to: viu, type: operates, asset: transmission, label: operates the transmission the utility owns, status: needs_verification, source: *oatt}
      # bill: the state commission sets the bundled rate; FERC approves transmission; PJM prices ancillary services
      - {id: puc_viu_gen, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: generation, label: sets generation and fuel rates, status: needs_verification, source: *va585}
      - {id: puc_viu_cap, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: capacity, label: sets base rates that recover the utility's own generating capacity, status: needs_verification, source: *va585}
      - {id: pjm_viu_as, from: pjm, to: viu, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: charges ancillary services at PJM market prices, status: needs_verification, source: *oatt}
      - {id: ferc_viu_tx, from: ferc, to: viu, type: regulates, domain: rates, label: approves the utility's wholesale transmission revenue requirement in PJM's tariff, status: needs_verification, source: *oatt}
      - {id: puc_viu_tx, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: transmission, label: sets the retail transmission rate that recovers PJM network charges, status: needs_verification, source: *va585}
      - {id: puc_viu_dx, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates, status: needs_verification, source: *va585}
      - {id: puc_viu_rider, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders, status: needs_verification, source: *va585}
      - {id: viu_res_gen, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation and fuel rate, status: needs_verification, source: *va585}
      - {id: viu_res_cap, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity cost within base rates, status: needs_verification, source: *va585}
      - {id: viu_res_as, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *va585}
      - {id: viu_res_tx, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va585}
      - {id: viu_res_dx, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va585}
      - {id: viu_res_rider, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va585}
      - {id: viu_sc_gen, from: viu, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation and fuel rate, status: needs_verification, source: *va585}
      - {id: viu_sc_cap, from: viu, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity cost within base rates, status: needs_verification, source: *va585}
      - {id: viu_sc_as, from: viu, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *va585}
      - {id: viu_sc_tx, from: viu, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va585}
      - {id: viu_sc_dx, from: viu, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va585}
      - {id: viu_sc_rider, from: viu, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va585}
      - {id: viu_lci_gen, from: viu, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation and fuel rate, status: needs_verification, source: *va585}
      - {id: viu_lci_cap, from: viu, to: large_ci, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity cost within base rates, status: needs_verification, source: *va585}
      - {id: viu_lci_as, from: viu, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *va585}
      - {id: viu_lci_tx, from: viu, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va585}
      - {id: viu_lci_dx, from: viu, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va585}
      - {id: viu_lci_rider, from: viu, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va585}
      - {id: viu_ll_gen, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation and fuel rate, status: needs_verification, source: *va585}
      - {id: viu_ll_cap, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity cost within base rates, status: needs_verification, source: *va585}
      - {id: viu_ll_as, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *va585}
      - {id: viu_ll_tx, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va585}
      - {id: viu_ll_dx, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va585}
      - {id: viu_ll_rider, from: viu, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va585}

  # Electric cooperative in Virginia: member-owned, board elected by members, but unlike most co-ops in Texas its rates
  # stay under the state commission (Va. Code 56-231.34, 56-585.3). The board may move distribution rates up to 5%
  # in any three years with only an informational filing; general rate cases go to the SCC. Its wholesale supplier
  # (ODEC for REC) sells under a FERC-accepted formula rate, which the SCC does not regulate.
  coop:
    label: Electric cooperative
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State commission that approves the co-op's rates in general rate cases. It has no jurisdiction over the wholesale supplier's FERC-regulated rate.
        source: &va2313 {title: "Va. Code § 56-231.34 (cooperatives subject to SCC jurisdiction)", url: "https://law.lis.virginia.gov/vacode/title56/chapter9.1/section56-231.34/", accessed: "2026-10-08"}
        status: needs_verification
      - id: coop_board
        name: Board of directors
        slot: coop_board
        lane: regulators
        kind: legislature
        jurisdiction: private
        description: Corporate board elected by the co-op's members. Governs the co-op; may change distribution rates by up to 5% in any three years without commission approval.
        source: &va5853 {title: "Va. Code § 56-585.3 (regulation of cooperative rates)", url: "https://law.lis.virginia.gov/vacode/title56/chapter23/section56-585.3/", accessed: "2026-10-08"}
        status: needs_verification
      - id: wholesale_supplier
        name: Wholesale supplier
        slot: wholesale_supplier
        lane: wholesale
        kind: lse
        jurisdiction: private
        description: Sells the co-op its wholesale power, capacity and ancillary services as the load-serving entity in PJM. A generation and transmission co-op such as ODEC sells under a FERC-accepted formula rate, which state commissions do not regulate.
        holds_assets: [generation, transmission]
        source: &odec {title: "Old Dominion Electric Cooperative, Form 10-K filings (members, formula rate)", url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000885568&type=10-K", accessed: "2026-10-08"}
        status: needs_verification
      - id: coop
        name: Co-op
        slot: coop
        lane: retail
        kind: coop
        jurisdiction: private
        description: Member-owned distribution utility. Owns the local wires, buys wholesale power and sells to its members, who cannot pick another supplier.
        holds_assets: [distribution]
        source: *va2313
        status: needs_verification
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: Household member of a Virginia electric cooperative.}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: Small business member of the co-op.}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: Large commercial or industrial member of the co-op.}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: Very large site such as a data center served by the co-op.}
    edges:
      - {id: puc_coop, from: state_puc, to: coop, type: regulates, domain: rates, label: "regulates the co-op's rates and service, including how it recovers wholesale power cost", status: needs_verification, source: *va2313}
      - {id: board_coop_gov, from: coop_board, to: coop, type: regulates, domain: governance, label: governs the co-op; may change distribution rates up to 5% in 3 years, status: needs_verification, source: *va5853}
      - {id: ferc_ws, from: ferc, to: wholesale_supplier, type: regulates, domain: rates, label: accepts the wholesale supplier's formula rate, status: needs_verification, source: *odec}
      - {id: pjm_operates_tx_ws, from: pjm, to: wholesale_supplier, type: operates, asset: transmission, label: operates the transmission the wholesale supplier owns, status: needs_verification, source: *odec}
      - {id: ws_rpm_cap, from: wholesale_supplier, to: rpm, type: pays, mode: market, rate_component: capacity, label: buys part of its capacity obligation in RPM, status: needs_verification, source: *odec}
      - {id: ws_pjm_as, from: wholesale_supplier, to: pjm, type: pays, mode: market, rate_component: ancillary_uplift, label: pays PJM ancillary charges as the load-serving entity, status: needs_verification, source: *odec}
      # bill: supply comes from the wholesale supplier's FERC-accepted rate, passed through by the co-op; wires and riders
      # are approved by the SCC
      - {id: ws_coop_gen, from: wholesale_supplier, to: coop, type: sets_rate, mode: sets, rate_component: generation, label: sets the wholesale energy charge under its formula rate, status: needs_verification, source: *odec}
      - {id: ferc_ws_gen, from: ferc, to: wholesale_supplier, type: sets_rate, mode: approves, rate_component: generation, label: accepts the wholesale formula rate, status: needs_verification, source: *odec}
      - {id: ws_coop_cap, from: wholesale_supplier, to: coop, type: sets_rate, mode: sets, rate_component: capacity, label: sets the wholesale demand charge under its formula rate, status: needs_verification, source: *odec}
      - {id: ferc_ws_cap, from: ferc, to: wholesale_supplier, type: sets_rate, mode: approves, rate_component: capacity, label: accepts the wholesale formula rate, status: needs_verification, source: *odec}
      - {id: ws_coop_as, from: wholesale_supplier, to: coop, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: recovers PJM ancillary charges in its wholesale rate, status: needs_verification, source: *odec}
      - {id: ferc_coop_tx, from: ferc, to: coop, type: regulates, domain: rates, label: approves the PJM transmission rates the co-op pays at wholesale, status: needs_verification, source: *oatt}
      - {id: puc_coop_tx, from: state_puc, to: coop, type: sets_rate, mode: approves, rate_component: transmission, label: approves the retail rates that recover PJM transmission charges, status: needs_verification, source: *va5853}
      - {id: puc_coop_dx, from: state_puc, to: coop, type: sets_rate, mode: approves, rate_component: distribution, label: approves distribution rates in general rate cases, status: needs_verification,
         source: {title: "SCC Case PUR-2017-00044, Rappahannock Electric Cooperative rate case (hearing examiner's report)", url: "https://scc.virginia.gov/docketsearch/DOCS/3%24pn01!.PDF", accessed: "2026-10-08"}}
      - {id: puc_coop_rider, from: state_puc, to: coop, type: sets_rate, mode: approves, rate_component: riders_public_purpose, label: approves rate adjustment clauses, status: needs_verification, source: *va5853}
      - {id: coop_res_gen, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_res_cap, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_res_as, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_res_tx, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va5853}
      - {id: coop_res_dx, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va5853}
      - {id: coop_res_rider, from: coop, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va5853}
      - {id: coop_sc_gen, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_sc_cap, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_sc_as, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_sc_tx, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va5853}
      - {id: coop_sc_dx, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va5853}
      - {id: coop_sc_rider, from: coop, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va5853}
      - {id: coop_lci_gen, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_lci_cap, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_lci_as, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_lci_tx, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va5853}
      - {id: coop_lci_dx, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va5853}
      - {id: coop_lci_rider, from: coop, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va5853}
      - {id: coop_ll_gen, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_ll_cap, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within the wholesale power cost, status: needs_verification, source: *va5853}
      - {id: coop_ll_as, from: coop, to: large_load, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within the wholesale power cost, status: needs_verification, source: *va5853}
