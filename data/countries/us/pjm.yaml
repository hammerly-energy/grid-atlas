schema_version: 2
country: US
market: pjm
name: PJM
coverage_note: PJM covers all or parts of 13 states plus DC. Only ComEd's zone of Illinois (Ameren Illinois is in MISO) and only part of Kentucky (not LG&E/KU).

# Seven setups. The supply option a customer has depends on the state: default service (PA, NJ), Illinois Power Agency
# procurement (ComEd), a competitive supplier, municipal aggregation (IL, OH, NJ), or a vertically integrated utility
# (WV; VA with choice only above 5 MW), or a Virginia co-op. Not modelled yet: municipal utilities, Maryland and
# Delaware co-ops, Ohio and Maryland default service variants.
base:
  nodes:
    - id: ferc
      name: FERC
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: Regulates PJM's wholesale markets and interstate transmission rates.
      domain_area:
        full: [lower48]
        partial: [ercot]
        partial_label: reliability only
        note: Contiguous US; inside ERCOT only reliability standards apply, not wholesale rates or market rules
        source: {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}
        status: needs_verification
    - id: pjm
      name: PJM
      lane: market_operator
      kind: iso
      jurisdiction: private
      description: Regional transmission organization for all or parts of 13 states and DC. Runs the energy, capacity (RPM) and ancillary service markets. Owns no wires.
      domain_area:
        full: [pjm]
        note: All or parts of 13 states and DC (county-level approximation from EIA-861)
        source: {title: EIA-861 2025 service territories and balancing authorities, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-07"}
        status: needs_verification
    - id: rpm
      name: RPM capacity auction
      lane: market_operator
      kind: market
      jurisdiction: private
      description: Reliability Pricing Model; PJM's capacity auction. Designed to run three years ahead of delivery; recent auctions ran on a compressed schedule. FERC approves its rules and demand curve.
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Sell energy and capacity into PJM's markets.
      holds_assets: [generation]
      source: {title: EIA-860 generator inventory, url: "https://www.eia.gov/electricity/data/eia860/", accessed: "2026-10-07"}

    - id: nerc
      name: NERC
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Sets reliability standards approved by FERC; enforces them through regional entities.
      domain_area:
        full: [lower48, nerc_canada, mx_bcn]
        note: Contiguous US, most of Canada and northern Baja California (Mexico)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: rf
      name: ReliabilityFirst
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: NERC's regional entity for most of the PJM footprint and PJM's lead regional entity.
      source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}
      status: needs_verification
      domain_area:
        full: [re_rf]
        note: Counties whose utilities report ReliabilityFirst to EIA-861 (county-level approximation)
        source: {title: EIA-861 2025 NERC region by utility, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-08"}
        status: needs_verification
  edges:
    # reliability (FPA s.215): FERC approves NERC standards; the regional entity enforces them
    - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification,
       source: &nerc {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}}
    - {id: nerc_rf_rel, from: nerc, to: rf, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
    - {id: rf_pjm_rel, from: rf, to: pjm, type: regulates, domain: reliability, label: enforces reliability standards on PJM, status: needs_verification, source: *nerc}
    # every setup: FERC approves PJM's rules; PJM dispatches and runs RPM
    - {id: ferc_pjm, from: ferc, to: pjm, type: regulates, domain: market_rules, label: approves PJM's tariff and market rules, status: needs_verification,
       source: &oatt {title: PJM Open Access Transmission Tariff, url: "https://www.pjm.com/directory/merged-tariffs/oatt.pdf", accessed: "2026-10-07"}}
    - {id: pjm_dispatch, from: pjm, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *oatt}
    - {id: pjm_operates_rpm, from: pjm, to: rpm, type: operates, label: runs the RPM capacity auction, status: needs_verification,
       source: &rpm {title: PJM capacity market (RPM), url: "https://www.pjm.com/markets-and-operations/rpm", accessed: "2026-10-07"}}
    - {id: ferc_rpm_cap, from: ferc, to: rpm, type: sets_rate, mode: approves, rate_component: capacity, label: "approves RPM's rules, demand curve and price limits", status: needs_verification, source: *rpm}

archetypes:
  # Default service (PA, NJ, MD, DE, DC, OH): a customer who has not picked a supplier gets supply that wholesale
  # suppliers win in a PUC-approved auction or RFP. Large customers get hourly-priced default service.
  restructured_choice:
    label: Default service
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State utility commission (e.g. PA PUC, NJ BPU). Sets distribution rates and approves the default service plan and the auction results.
      - id: default_supplier
        name: Wholesale suppliers
        lane: wholesale
        kind: lse
        jurisdiction: private
        description: Wholesale suppliers that win the utility's default service auction or RFP and deliver full-requirements supply at a fixed price (residential, small commercial) or a spot price (large customers).
      - id: edc
        name: EDC
        slot: edc
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Electric distribution company. Owns the local wires and bills default service customers.
        holds_assets: [transmission, distribution]
        source: &pjmmembers {title: PJM member list, url: "https://www.pjm.com/about-pjm/member-services/member-list", accessed: "2026-10-07"}
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: Household customer on default service (has not picked a competitive supplier).}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: Small business on fixed-price default service.}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: "Large customer (above 100 kW at PECO) on hourly-priced default service unless it picks a supplier."}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center, often served at transmission voltage; on hourly-priced default service unless it picks a supplier."}
    edges:
      # regulation and operations
      - {id: puc_edc, from: state_puc, to: edc, type: regulates, domain: rates, label: regulates distribution service and default service, status: needs_verification,
         source: &pa2807 {title: "66 Pa.C.S. § 2807 (duties of electric distribution companies; default service)", url: "https://www.legis.state.pa.us/cfdocs/legis/LI/consCheck.cfm?txtType=HTM&ttl=66&div=0&chpt=28&sctn=7&subsctn=0", accessed: "2026-10-08"}}
      - {id: pjm_operates_tx, from: pjm, to: edc, type: operates, asset: transmission, label: operates the transmission the EDC owns, status: needs_verification, source: *oatt}
      - {id: puc_auction, from: state_puc, to: default_supplier, type: plans_procures, label: approves the default service plan and auction or RFP, status: needs_verification,
         source: &njbgs {title: "NJ BPU order approving the 2025 Basic Generation Service auction results", url: "https://nj.gov/bpu/pdf/boardorders/2025/20250212/LSA%20ORDER%202025%20BGS%20Auction%20Results.pdf", accessed: "2026-10-08"}}
      # bill: generation, capacity, ancillary. Fixed-price classes: the auction price, limited by the PUC's approval of the result.
      # Hourly classes: PJM's real-time energy price and RPM's capacity price, passed through.
      - {id: sup_edc_gen, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: generation, applies_to: [residential, small_commercial], label: fixed energy price set by auction or RFP bids, status: needs_verification, source: *njbgs}
      - {id: puc_sup_gen, from: state_puc, to: default_supplier, type: sets_rate, mode: approves, rate_component: generation, applies_to: [residential, small_commercial], label: approves the auction results, status: needs_verification, source: *njbgs}
      - {id: pjm_edc_gen, from: pjm, to: edc, type: sets_rate, mode: market, rate_component: generation, applies_to: [large_ci, large_load], label: hourly-priced default service at PJM real-time energy prices, status: needs_verification,
         source: &pecodsp {title: "PAIEUG answer on PECO's default service program 2017-2019 (P-2016-2534980)", url: "https://www.puc.pa.gov/pcdocs/1430606.pdf", accessed: "2026-10-08"}}
      - {id: sup_edc_cap, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: capacity, applies_to: [residential, small_commercial], label: capacity cost priced into auction bids, status: needs_verification, source: *njbgs}
      - {id: puc_sup_cap, from: state_puc, to: default_supplier, type: sets_rate, mode: approves, rate_component: capacity, applies_to: [residential, small_commercial], label: approves the auction results, status: needs_verification, source: *njbgs}
      - {id: rpm_edc_cap, from: rpm, to: edc, type: sets_rate, mode: market, rate_component: capacity, applies_to: [large_ci, large_load], label: capacity at the RPM clearing price on hourly-priced service, status: needs_verification, source: *rpm}
      - {id: sup_rpm_cap, from: default_supplier, to: rpm, type: pays, mode: market, rate_component: capacity, label: pays the RPM capacity price, status: needs_verification, source: *rpm}
      - {id: sup_edc_as, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: ancillary_uplift, applies_to: [residential, small_commercial], label: ancillary cost priced into auction bids, status: needs_verification, source: *njbgs}
      - {id: pjm_edc_as, from: pjm, to: edc, type: sets_rate, mode: market, rate_component: ancillary_uplift, applies_to: [large_ci, large_load], label: ancillary services at PJM market prices on hourly-priced service, status: needs_verification, source: *pecodsp}
      # bill: wires and riders
      - {id: ferc_edc_tx, from: ferc, to: edc, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *oatt}
      - {id: puc_edc_dx, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in rate cases, status: needs_verification, source: *pa2807}
      - {id: puc_edc_rider, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency programs), status: needs_verification, source: *pa2807}
      - {id: edc_res_gen, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_res_cap, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_res_as, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_res_tx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pecodsp}
      - {id: edc_res_dx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edc_res_rider, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}
      - {id: edc_sc_gen, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_sc_cap, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_sc_as, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_sc_tx, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pecodsp}
      - {id: edc_sc_dx, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edc_sc_rider, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}
      - {id: edc_lci_gen, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_lci_cap, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_lci_as, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_lci_tx, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pecodsp}
      - {id: edc_lci_dx, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edc_lci_rider, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}
      - {id: edc_ll_gen, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_ll_cap, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_ll_as, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within default service supply, status: needs_verification, source: *pa2807}
      - {id: edc_ll_tx, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pecodsp}
      - {id: edc_ll_dx, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edc_ll_rider, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}

  # ComEd's zone of Illinois: the Illinois Power Agency (IPA) plans and runs the procurement of default supply; the ICC
  # approves the plan and the results. ComEd buys capacity in RPM and the rest of its energy in PJM's markets.
  # Customers above 100 kW are on hourly supply.
  default_service_ipa:
    label: Default service (Illinois Power Agency)
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: Illinois Commerce Commission. Sets ComEd's delivery rates and approves the Illinois Power Agency's procurement plan and results.
        source: &il16108 {title: "220 ILCS 5/16-108 (recovery of delivery service costs)", url: "https://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=022000050K16-108", accessed: "2026-10-08"}
        status: needs_verification
      - id: ipa
        name: Illinois Power Agency
        lane: regulators
        kind: policy_maker
        jurisdiction: subnational
        description: State agency that writes the annual electricity procurement plan for ComEd's default supply customers and runs the procurement events.
        source: &ipaplan {title: Illinois Power Agency annual electricity procurement plan, url: "https://ipa.illinois.gov/electricity-procurement/electricity-procurement-plan.html", accessed: "2026-10-08"}
        status: needs_verification
      - id: default_supplier
        name: Wholesale suppliers
        lane: wholesale
        kind: lse
        jurisdiction: private
        description: Wholesale suppliers that win the Illinois Power Agency's procurement events and sell energy blocks to ComEd.
      - id: edc
        name: EDC
        slot: edc
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Electric distribution company. Owns the local wires, buys default supply under the agency's plan and bills it at cost.
        holds_assets: [transmission, distribution]
        source: *pjmmembers
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: Household customer on ComEd's default supply.}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: Small business on ComEd's default supply.}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: Customer above 100 kW. Its supply was declared competitive (220 ILCS 5/16-113); ComEd offers it only hourly supply at PJM prices.}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: Very large site such as a data center; on hourly supply unless it picks a supplier.}
    edges:
      - {id: puc_edc, from: state_puc, to: edc, type: regulates, domain: rates, label: regulates delivery service and default supply, status: needs_verification, source: *il16108}
      - {id: puc_ipa, from: state_puc, to: ipa, type: regulates, domain: rates, label: approves the agency's procurement plan and the procurement results, status: needs_verification, source: *ipaplan}
      - {id: ipa_procures, from: ipa, to: default_supplier, type: plans_procures, label: runs the procurement events for ComEd's default supply, status: needs_verification, source: *ipaplan}
      - {id: pjm_operates_tx, from: pjm, to: edc, type: operates, asset: transmission, label: operates the transmission the EDC owns, status: needs_verification, source: *oatt}
      # bill: generation has two line items for fixed-price classes: IPA-procured blocks and PJM market energy
      - {id: sup_edc_gen, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: generation, subcomponent: Energy blocks bought by the Illinois Power Agency, applies_to: [residential, small_commercial], label: energy block prices set by procurement bids, status: needs_verification, source: *ipaplan}
      - {id: puc_sup_gen, from: state_puc, to: default_supplier, type: sets_rate, mode: approves, rate_component: generation, subcomponent: Energy blocks bought by the Illinois Power Agency, applies_to: [residential, small_commercial], label: approves the procurement results, status: needs_verification, source: *ipaplan}
      - {id: pjm_edc_gen_spot, from: pjm, to: edc, type: sets_rate, mode: market, rate_component: generation, subcomponent: Energy bought in PJM's markets, applies_to: [residential, small_commercial], label: energy beyond the procured blocks at PJM day-ahead and real-time prices, status: needs_verification, source: *ipaplan}
      - {id: pjm_edc_gen, from: pjm, to: edc, type: sets_rate, mode: market, rate_component: generation, applies_to: [large_ci, large_load], label: hourly supply at PJM real-time energy prices, status: needs_verification,
         source: &il16113 {title: "220 ILCS 5/16-113 (declaration of service as a competitive service)", url: "https://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=022000050K16-113", accessed: "2026-10-08"}}
      # bill: ComEd pays RPM itself; FERC approves RPM's rules (base edge), which shows as the limit
      - {id: rpm_edc_cap, from: rpm, to: edc, type: sets_rate, mode: market, rate_component: capacity, label: capacity for ComEd's supply customers at the RPM clearing price, status: needs_verification, source: *ipaplan}
      - {id: pjm_edc_as, from: pjm, to: edc, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: ancillary services at PJM market prices, status: needs_verification, source: *oatt}
      - {id: ferc_edc_tx, from: ferc, to: edc, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *oatt}
      - {id: puc_edc_dx, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: distribution, label: sets delivery rates, status: needs_verification, source: *il16108}
      - {id: puc_edc_rider, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency programs), status: needs_verification, source: *il16108}
      - {id: comed_res_gen, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_res_cap, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_res_as, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_res_tx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills its transmission services charge, status: needs_verification, source: *oatt}
      - {id: comed_res_dx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *il16108}
      - {id: comed_res_rider, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *il16108}
      - {id: comed_sc_gen, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_sc_cap, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_sc_as, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_sc_tx, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills its transmission services charge, status: needs_verification, source: *oatt}
      - {id: comed_sc_dx, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *il16108}
      - {id: comed_sc_rider, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *il16108}
      - {id: comed_lci_gen, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_lci_cap, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity within its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_lci_as, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within its purchased electricity charge, status: needs_verification, source: *ipaplan}
      - {id: comed_lci_tx, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills its transmission services charge, status: needs_verification, source: *oatt}
