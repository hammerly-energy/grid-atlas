schema_version: 2
country: US
market: pjm
name: PJM
coverage_note: PJM covers all or parts of 13 states plus DC. Only ComEd's zone of Illinois (Ameren Illinois is in MISO) and only part of Kentucky (not LG&E/KU).

# Thin slice: restructured_choice for a default-service customer in Pennsylvania, residential only.
# A customer who picks a competitive supplier gets a different generation path; modelled in milestone 3.
base:
  nodes:
    - id: ferc
      name: FERC
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: Regulates PJM's wholesale markets and interstate transmission rates.
      domain_area:
        full: [lower48]
        partial: [ercot]
        partial_label: reliability only
        note: Contiguous US; inside ERCOT only reliability standards apply, not wholesale rates or market rules
        source: {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}
        status: needs_verification
    - id: pjm
      name: PJM
      lane: market_operator
      kind: iso
      jurisdiction: national
      description: Regional transmission organization for all or parts of 13 states and DC. Runs the energy, capacity (RPM) and ancillary service markets. Owns no wires.
      domain_area:
        full: [pjm]
        note: All or parts of 13 states and DC (county-level approximation from EIA-861)
        source: {title: EIA-861 2025 service territories and balancing authorities, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-07"}
        status: needs_verification
    - id: rpm
      name: RPM capacity auction
      lane: market_operator
      kind: market
      jurisdiction: national
      description: Reliability Pricing Model; PJM's annual capacity auction, about three years ahead of delivery.
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Sell energy and capacity into PJM's markets.
      holds_assets: [generation]
      source: {title: EIA-860 generator inventory, url: "https://www.eia.gov/electricity/data/eia860/", accessed: "2026-10-07"}

    - id: nerc
      name: NERC
      lane: regulators
      kind: reliability_body
      jurisdiction: national
      description: Sets reliability standards approved by FERC; enforces them through regional entities.
      domain_area:
        full: [lower48, canada]
        note: Contiguous US, most of Canada and northern Baja California (Mexico)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: rf
      name: ReliabilityFirst
      lane: regulators
      kind: reliability_body
      jurisdiction: national
      description: NERC's regional entity for most of the PJM footprint and PJM's lead regional entity.
      source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}
      status: needs_verification
  edges:
    # reliability (FPA s.215): FERC approves NERC standards; the regional entity enforces them
    - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification,
       source: &nerc {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}}
    - {id: nerc_rf_rel, from: nerc, to: rf, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
    - {id: rf_pjm_rel, from: rf, to: pjm, type: regulates, domain: reliability, label: enforces reliability standards on PJM, status: needs_verification, source: *nerc}

archetypes:
  restructured_choice:
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State utility commission (e.g. PA PUC). Sets distribution rates and approves the default service plan.
      - id: default_supplier
        name: Wholesale suppliers
        lane: wholesale
        kind: lse
        jurisdiction: private
        description: Wholesale suppliers that win the utility's default service auction and deliver full-requirements supply.
      - id: edc
        name: EDC
        slot: edc
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Electric distribution company. Owns the local wires and bills default service customers.
        holds_assets: [transmission, distribution]
        source: &pjmmembers {title: PJM member list, url: "https://www.pjm.com/about-pjm/member-services/member-list", accessed: "2026-10-07"}
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer on default service (has not picked a competitive supplier).
    edges:
      # regulation
      - {id: ferc_pjm, from: ferc, to: pjm, type: regulates, domain: market_rules, label: approves PJM's tariff and market rules, status: needs_verification,
         source: &oatt {title: PJM Open Access Transmission Tariff, url: "https://www.pjm.com/directory/merged-tariffs/oatt.pdf", accessed: "2026-10-07"}}
      - {id: puc_edc, from: state_puc, to: edc, type: regulates, domain: rates, label: regulates distribution service and default service, status: needs_verification,
         source: &papuc {title: Pennsylvania PUC, url: "https://www.puc.pa.gov", accessed: "2026-10-07"}}
      # operations
      - {id: pjm_dispatch, from: pjm, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *oatt}
      - {id: pjm_operates_tx, from: pjm, to: edc, type: operates, asset: transmission, label: operates the transmission the EDC owns, status: needs_verification, source: *oatt}
      - {id: puc_auction, from: state_puc, to: default_supplier, type: plans_procures, label: approves the default service procurement, status: needs_verification, source: *papuc}
      # bill: generation, capacity, ancillary (inside the full-requirements default service price)
      - {id: sup_edc_gen, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: generation, label: energy price set by auction bids, status: needs_verification, source: *papuc}
      - {id: sup_rpm_cap, from: default_supplier, to: rpm, type: pays, mode: market, rate_component: capacity, label: pays the RPM capacity price, status: needs_verification,
         source: &rpm {title: PJM capacity market (RPM), url: "https://www.pjm.com/markets-and-operations/rpm", accessed: "2026-10-07"}}
      - {id: pjm_operates_rpm, from: pjm, to: rpm, type: operates, label: runs the RPM capacity auction, status: needs_verification, source: *rpm}
      - {id: sup_edc_cap, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: capacity, label: capacity cost priced into auction bids, status: needs_verification, source: *rpm}
      - {id: sup_edc_as, from: default_supplier, to: edc, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: ancillary cost priced into auction bids, status: needs_verification, source: *oatt}
      - {id: edc_res_gen, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the default service price, status: needs_verification, source: *papuc}
      - {id: edc_res_cap, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity cost within the default service price, status: needs_verification, source: *papuc}
      - {id: edc_res_as, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: bills ancillary cost within the default service price, status: needs_verification, source: *papuc}
      # bill: transmission
      - {id: ferc_edc_tx, from: ferc, to: edc, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *oatt}
      - {id: edc_res_tx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *papuc}
      # bill: distribution and riders
      - {id: puc_edc_dx, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in rate cases, status: needs_verification, source: *papuc}
      - {id: edc_res_dx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *papuc}
      - {id: puc_edc_rider, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency programs), status: needs_verification, source: *papuc}
      - {id: edc_res_rider, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *papuc}


  # Vertically integrated with limited retail choice (Virginia): one utility owns generation and wires and the state
  # commission sets bundled rates. Only customers above 5 MW may shop (Va. Code 56-577), so residential has no choice.
  limited_choice:
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State commission that sets the utility's bundled retail rates, including generation.
        source: &va585 {title: "Va. Code § 56-585.1 (SCC review of utility rates)", url: "https://law.lis.virginia.gov/vacode/title56/chapter23/section56-585.1/", accessed: "2026-10-08"}
        status: needs_verification
      - id: serc
        name: SERC
        lane: regulators
        kind: reliability_body
        jurisdiction: national
        description: NERC's regional entity for the southeastern US, including Virginia.
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}
        status: needs_verification
      - id: viu
        name: Vertically integrated utility
        slot: viu
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Owns generation, transmission and distribution and sells to residential customers, who cannot pick another supplier.
        holds_assets: [generation, transmission, distribution]
        source: *va585
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer of a vertically integrated utility. Only customers above 5 MW may buy from a competitive supplier.
    edges:
      - {id: nerc_serc_rel, from: nerc, to: serc, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
      - {id: serc_viu_rel, from: serc, to: viu, type: regulates, domain: reliability, label: enforces reliability standards on the utility's transmission, status: needs_verification, source: *nerc}
      - {id: ferc_pjm, from: ferc, to: pjm, type: regulates, domain: market_rules, label: approves PJM's tariff and market rules, status: needs_verification, source: *oatt}
      - {id: puc_viu, from: state_puc, to: viu, type: regulates, domain: rates, label: regulates bundled retail rates, status: needs_verification, source: *va585}
      - {id: pjm_dispatch, from: pjm, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *oatt}
      - {id: pjm_operates_tx_viu, from: pjm, to: viu, type: operates, asset: transmission, label: operates the transmission the utility owns, status: needs_verification, source: *oatt}
      - {id: pjm_operates_rpm, from: pjm, to: rpm, type: operates, label: runs the RPM capacity auction, status: needs_verification, source: *rpm}
      # bill: the state commission sets the bundled rate; FERC approves transmission; PJM prices ancillary services
      - {id: puc_viu_gen, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: generation, label: sets generation and fuel rates, status: needs_verification, source: *va585}
      - {id: viu_res_gen, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *va585}
      - {id: puc_viu_cap, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: capacity, label: sets base rates that recover the utility's own generating capacity, status: needs_verification, source: *va585}
      - {id: viu_res_cap, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: bills capacity cost within base rates, status: needs_verification, source: *va585}
      - {id: pjm_viu_as, from: pjm, to: viu, type: sets_rate, mode: market, rate_component: ancillary_uplift, label: charges ancillary services at PJM market prices, status: needs_verification, source: *oatt}
      - {id: viu_res_as, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: ancillary_uplift, label: recovers ancillary costs in retail rates, status: needs_verification, source: *va585}
      - {id: ferc_viu_tx, from: ferc, to: viu, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *oatt}
      - {id: viu_res_tx, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *va585}
      - {id: puc_viu_dx, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates, status: needs_verification, source: *va585}
      - {id: viu_res_dx, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *va585}
      - {id: puc_viu_rider, from: state_puc, to: viu, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: approves riders, status: needs_verification, source: *va585}
      - {id: viu_res_rider, from: viu, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *va585}

utilities:
  ComEd:
    area: IL
    archetypes: [restructured_choice]
    fills:
      state_puc: {name: Illinois Commerce Commission}
      edc:
        name: ComEd
        domain_area: {full: [comed], note: "ComEd service territory, Chicago and northern Illinois", source: &hifld {title: HIFLD Electric Retail Service Territories (archived), url: "https://source.coop/seerai/hifld/electric-retail-service-territories", accessed: "2026-10-08"}, status: needs_verification}
  Dominion Energy Virginia:
    area: VA
    archetypes: [limited_choice]
    fills:
      state_puc: {name: Virginia SCC}
      viu:
        name: Dominion Energy Virginia
        domain_area: {full: [dominion_va], note: "Dominion Energy Virginia service territory, central, northern and eastern Virginia and northeast North Carolina", source: *hifld, status: needs_verification}
  PSE&G:
    area: NJ
    archetypes: [restructured_choice]
    fills:
      state_puc: {name: NJ Board of Public Utilities}
      edc:
        name: PSE&G
        domain_area: {full: [pseg], note: "PSE&G service territory, northern and central New Jersey", source: *hifld, status: needs_verification}
  PECO:
    area: PA
    archetypes: [restructured_choice]
    fills:
      state_puc: {name: Pennsylvania PUC}
      edc:
        name: PECO
        domain_area: {full: [peco], note: "PECO service territory, Philadelphia and southeastern Pennsylvania", source: *hifld, status: needs_verification}
