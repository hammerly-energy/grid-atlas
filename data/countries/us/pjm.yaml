  # Vertically integrated, no retail choice (West Virginia, the PJM part of Kentucky): one utility owns generation and
  # wires, and the state commission sets bundled rates.
  vertically_integrated:
    label: Vertically integrated
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State commission that sets the utility's bundled retail rates, including generation and fuel.
        source: &wv {title: "W. Va. Code § 24-2-3 (Public Service Commission power to set rates)", url: "https://code.wvlegislature.gov/24-2-3/", accessed: "2026-10-08"}
        status: needs_verification
      - id: viu
        name: Vertically integrated utility
        slot: viu
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Owns generation, transmission and distribution and sells to every customer in its area; no customer can pick another supplier.
        holds_assets: [generation, transmission, distribution]
