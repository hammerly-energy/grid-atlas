  # A customer in a restructured state who picked a competitive supplier (PA EGS, NJ TPS, IL ARES, OH CRES, MD).
  # The supplier sets the supply price; the utility keeps the wires and usually bills the supplier's charges too.
  competitive_supplier:
    label: Competitive supplier
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State utility commission. Licenses retail suppliers and sets the utility's distribution rates; does not set supplier prices.
      - id: supplier
        name: Retail supplier
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: Licensed retail supplier the customer picked. Buys wholesale power and sets the supply price in its contract; its charges usually appear on the utility's bill.
        source: &pa2809 {title: "66 Pa.C.S. § 2809 (requirements for electric generation suppliers)", url: "https://www.legis.state.pa.us/cfdocs/legis/LI/consCheck.cfm?txtType=HTM&ttl=66&div=0&chpt=28&sctn=9&subsctn=0", accessed: "2026-10-08"}
        status: needs_verification
      - id: edc
        name: EDC
        slot: edc
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Electric distribution company. Owns the local wires; delivers the supplier's power.
        holds_assets: [transmission, distribution]
        source: *pjmmembers
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: Household customer that picked a competitive supplier.}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: Small business that picked a competitive supplier.}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: Large customer on a negotiated supply contract.}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: Very large site such as a data center on a negotiated supply contract.}
    edges:
      - {id: puc_sup_lic, from: state_puc, to: supplier, type: regulates, domain: licensing, label: licenses retail suppliers, status: needs_verification, source: *pa2809}
      - {id: puc_edc, from: state_puc, to: edc, type: regulates, domain: rates, label: regulates distribution service, status: needs_verification, source: *pa2807}
      - {id: pjm_operates_tx, from: pjm, to: edc, type: operates, asset: transmission, label: operates the transmission the EDC owns, status: needs_verification, source: *oatt}
      - {id: sup_pjm_gen, from: supplier, to: pjm, type: pays, mode: market, rate_component: generation, label: buys energy at PJM prices or through bilateral contracts, status: needs_verification, source: *oatt}
      - {id: sup_rpm_cap, from: supplier, to: rpm, type: pays, mode: market, rate_component: capacity, label: pays the RPM capacity price for its customers' load, status: needs_verification, source: *rpm}
      # bill: transmission is part of supply in PA and IL: the supplier pays the zonal network rate and recovers it
      - {id: ferc_edc_tx, from: ferc, to: edc, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *oatt}
      - {id: edc_sup_tx, from: edc, to: supplier, type: sets_rate, mode: passes_through, rate_component: transmission, label: zonal network transmission rate the supplier pays through PJM, status: needs_verification, source: *oatt}
      - {id: puc_edc_dx, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in rate cases, status: needs_verification, source: *pa2807}
      - {id: puc_edc_rider, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency programs), status: needs_verification, source: *pa2807}
      - {id: sup_res_gen, from: supplier, to: residential, type: sets_rate, mode: sets, rate_component: generation, label: sets the supply price in its contract, status: needs_verification, source: *pa2809}
      - {id: sup_res_cap, from: supplier, to: residential, type: sets_rate, mode: sets, rate_component: capacity, label: sets capacity cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_res_as, from: supplier, to: residential, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: sets ancillary cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_res_tx, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission as part of supply in PA and IL, status: needs_verification, source: *oatt}
      - {id: sup_sc_gen, from: supplier, to: small_commercial, type: sets_rate, mode: sets, rate_component: generation, label: sets the supply price in its contract, status: needs_verification, source: *pa2809}
      - {id: sup_sc_cap, from: supplier, to: small_commercial, type: sets_rate, mode: sets, rate_component: capacity, label: sets capacity cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_sc_as, from: supplier, to: small_commercial, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: sets ancillary cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_sc_tx, from: supplier, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission as part of supply in PA and IL, status: needs_verification, source: *oatt}
      - {id: sup_lci_gen, from: supplier, to: large_ci, type: sets_rate, mode: sets, rate_component: generation, label: sets the supply price in its contract, status: needs_verification, source: *pa2809}
      - {id: sup_lci_cap, from: supplier, to: large_ci, type: sets_rate, mode: sets, rate_component: capacity, label: sets capacity cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_lci_as, from: supplier, to: large_ci, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: sets ancillary cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_lci_tx, from: supplier, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission as part of supply in PA and IL, status: needs_verification, source: *oatt}
      - {id: sup_ll_gen, from: supplier, to: large_load, type: sets_rate, mode: sets, rate_component: generation, label: sets the supply price in its contract, status: needs_verification, source: *pa2809}
      - {id: sup_ll_cap, from: supplier, to: large_load, type: sets_rate, mode: sets, rate_component: capacity, label: sets capacity cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_ll_as, from: supplier, to: large_load, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: sets ancillary cost inside its contract price, status: needs_verification, source: *pa2809}
      - {id: sup_ll_tx, from: supplier, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission as part of supply in PA and IL, status: needs_verification, source: *oatt}
      - {id: edcs_res_dx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edcs_res_rider, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}
      - {id: edcs_sc_dx, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edcs_sc_rider, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}
      - {id: edcs_lci_dx, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edcs_lci_rider, from: edc, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}
      - {id: edcs_ll_dx, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pa2807}
      - {id: edcs_ll_rider, from: edc, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *pa2807}

  # Opt-out municipal aggregation (IL, OH, NJ): a municipality picks a supplier by bid for its residents and small
  # businesses, who are enrolled unless they opt out. Larger customers are not included.
  municipal_aggregation:
    label: Municipal aggregation
    nodes:
      - id: state_puc
        name: State PUC
        slot: state_puc
        lane: regulators
        kind: regulator
        jurisdiction: subnational
        description: State utility commission. Licenses the aggregation's supplier and sets the utility's distribution rates.
      - id: aggregator
        name: Municipal aggregation
        lane: retail
        kind: cca
        jurisdiction: local
        description: City, village or county that buys supply for its residents and small businesses by bid. In Illinois an opt-out program needs a referendum and an ordinance (20 ILCS 3855/1-92).
        source: &il192 {title: "20 ILCS 3855/1-92 (aggregation of electrical load by municipalities, townships and counties)", url: "https://www.ilga.gov/Documents/legislation/ilcs/documents/002038550K1-92.htm", accessed: "2026-10-08"}
        status: needs_verification
      - id: agg_supplier
        name: Aggregation supplier
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: Licensed retail supplier that won the municipality's bid. Its charges appear on the utility's bill.
      - id: edc
        name: EDC
        slot: edc
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Electric distribution company. Owns the local wires; delivers the aggregation supplier's power.
        holds_assets: [transmission, distribution]
        source: *pjmmembers
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: Household enrolled in the municipal aggregation (did not opt out).}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: Small business enrolled in the municipal aggregation.}
    edges:
      - {id: puc_sup_lic, from: state_puc, to: agg_supplier, type: regulates, domain: licensing, label: licenses retail suppliers, status: needs_verification,
         source: {title: "220 ILCS 5/16-115 (certification of alternative retail electric suppliers)", url: "https://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=022000050K16-115", accessed: "2026-10-08"}}
      - {id: puc_edc, from: state_puc, to: edc, type: regulates, domain: rates, label: regulates distribution service, status: needs_verification, source: *il16108}
      - {id: agg_procures, from: aggregator, to: agg_supplier, type: plans_procures, label: picks the supplier by bid and signs the contract, status: needs_verification, source: *il192}
      - {id: pjm_operates_tx, from: pjm, to: edc, type: operates, asset: transmission, label: operates the transmission the EDC owns, status: needs_verification, source: *oatt}
      - {id: agg_sup_gen_ok, from: aggregator, to: agg_supplier, type: sets_rate, mode: approves, rate_component: generation, label: approves the contract price, status: needs_verification, source: *il192}
      - {id: agg_sup_cap_ok, from: aggregator, to: agg_supplier, type: sets_rate, mode: approves, rate_component: capacity, label: approves the contract price, status: needs_verification, source: *il192}
      - {id: agg_sup_as_ok, from: aggregator, to: agg_supplier, type: sets_rate, mode: approves, rate_component: ancillary_uplift, label: approves the contract price, status: needs_verification, source: *il192}
      - {id: sup_rpm_cap, from: agg_supplier, to: rpm, type: pays, mode: market, rate_component: capacity, label: pays the RPM capacity price for the aggregation's load, status: needs_verification, source: *rpm}
      - {id: ferc_edc_tx, from: ferc, to: edc, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *oatt}
      - {id: edc_sup_tx, from: edc, to: agg_supplier, type: sets_rate, mode: passes_through, rate_component: transmission, label: zonal network transmission rate the supplier pays through PJM, status: needs_verification, source: *oatt}
      - {id: puc_edc_dx, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in rate cases, status: needs_verification, source: *il16108}
      - {id: puc_edc_rider, from: state_puc, to: edc, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets riders (e.g. energy efficiency programs), status: needs_verification, source: *il16108}
      - {id: agg_res_gen, from: agg_supplier, to: residential, type: sets_rate, mode: sets, rate_component: generation, label: sets the supply price in the aggregation contract, status: needs_verification, source: *il192}
      - {id: agg_res_cap, from: agg_supplier, to: residential, type: sets_rate, mode: sets, rate_component: capacity, label: sets capacity cost inside the contract price, status: needs_verification, source: *il192}
      - {id: agg_res_as, from: agg_supplier, to: residential, type: sets_rate, mode: sets, rate_component: ancillary_uplift, label: sets ancillary cost inside the contract price, status: needs_verification, source: *il192}
      - {id: agg_res_tx, from: agg_supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission as part of supply, status: needs_verification, source: *oatt}
      - {id: agg_sc_gen, from: agg_supplier, to: small_commercial, type: sets_rate, mode: sets, rate_component: generation, label: sets the supply price in the aggregation contract, status: needs_verification, source: *il192}
      - {id: agg_sc_cap, from: agg_supplier, to: small_commercial, type: sets_rate, mode: sets, rate_component: capacity, label: sets capacity cost inside the contract price, status: needs_verification, source: *il192}
