      - {id: agg_sc_tx, from: agg_supplier, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission as part of supply, status: needs_verification, source: *oatt}
      - {id: edca_res_dx, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *il16108}
      - {id: edca_res_rider, from: edc, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills riders, status: needs_verification, source: *il16108}
      - {id: edca_sc_dx, from: edc, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *il16108}
