schema_version: 2
country: US
market: caiso
name: CAISO
coverage_note: Not all of California is in CAISO's balancing area. LADWP, BANC (incl. SMUD), IID and TID run their own BAs; all but IID trade in CAISO's real-time market (WEIM).
# No central capacity market: resource adequacy (RA) is an obligation on each LSE, and its cost sits inside
# the IOU generation rate. Ancillary costs do too. exit_fee (PCIA) joins when iou_cca is entered.
bill_components: [generation, transmission, distribution, riders_public_purpose]

# Thin slice: iou_bundled, residential only.
base:
  nodes:
    - id: ferc
      name: FERC
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: Regulates CAISO's wholesale markets and the transmission rates of transmission owners under CAISO control.
      domain_area:
        full: [lower48]
        partial: [ercot]
        partial_label: reliability only
        note: Contiguous US; inside ERCOT only reliability standards apply, not wholesale rates or market rules
        source: {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}
        status: needs_verification
    - id: cpuc
      name: CPUC
      lane: regulators
      kind: regulator
      jurisdiction: subnational
      description: California Public Utilities Commission; sets investor-owned utility retail rates and resource adequacy obligations.
      domain_area:
        full: [ca]
        note: California; investor-owned utilities, not city-owned utilities
        source: {title: About the CPUC, url: "https://www.cpuc.ca.gov/about-cpuc", accessed: "2026-10-07"}
        status: needs_verification
    - id: caiso
      name: CAISO
      lane: market_operator
      kind: iso
      jurisdiction: subnational
      description: Operates the grid and the energy and ancillary service markets for most of California. No central capacity market. Owns no wires.
      domain_area:
        full: [caiso]
        note: Most of California; LADWP, BANC, IID and TID run their own balancing areas (county-level approximation)
        source: {title: EIA-861 2025 service territories and balancing authorities, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-07"}
        status: needs_verification
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Sell energy and ancillary services into CAISO's markets; sell RA capacity to LSEs bilaterally.
      holds_assets: [generation]
      source: {title: EIA-860 generator inventory, url: "https://www.eia.gov/electricity/data/eia860/", accessed: "2026-10-07"}

    - id: nerc
      name: NERC
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Sets reliability standards approved by FERC; enforces them through regional entities.
      domain_area:
        full: [lower48, nerc_canada, mx_bcn]
        note: Contiguous US, most of Canada and northern Baja California (Mexico)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: wecc
      name: WECC
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Western Electricity Coordinating Council; NERC's regional entity for the Western Interconnection, including all of California.
      source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}
      status: needs_verification
      domain_area:
        full: [re_wecc]
        note: "US part of the Western Interconnection by county (EIA-861); WECC also covers parts of Canada and Baja California"
        source: {title: EIA-861 2025 NERC region by utility, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-08"}
        status: needs_verification
  edges:
    # reliability (FPA s.215): FERC approves NERC standards; the regional entity enforces them
    - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification,
       source: &nerc {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}}
    - {id: nerc_wecc_rel, from: nerc, to: wecc, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
    - {id: wecc_caiso_rel, from: wecc, to: caiso, type: regulates, domain: reliability, label: enforces reliability standards on CAISO, status: needs_verification, source: *nerc}

archetypes:
  iou_bundled:
    nodes:
      - id: iou
        name: IOU
        slot: iou
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Investor-owned utility providing bundled service (generation procurement, wires and billing).
        holds_assets: [generation, transmission, distribution]
        source: &tca {title: CAISO Transmission Control Agreement, url: "https://www.caiso.com/library/transmission-control-agreement", accessed: "2026-10-07"}
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer on the IOU's bundled service.
    edges:
      # regulation and planning
      - {id: ferc_caiso, from: ferc, to: caiso, type: regulates, domain: market_rules, label: approves CAISO's tariff and market rules, status: needs_verification,
         source: &caisomkt {title: CAISO market operations, url: "https://www.caiso.com/market-operations", accessed: "2026-10-07"}}
      - {id: cpuc_iou, from: cpuc, to: iou, type: regulates, domain: rates, label: regulates retail rates and procurement, status: needs_verification,
         source: &ra {title: CPUC resource adequacy, url: "https://www.cpuc.ca.gov/RA", accessed: "2026-10-07"}}
      - {id: cpuc_ra, from: cpuc, to: iou, type: plans_procures, label: sets resource adequacy obligation, status: needs_verification, source: *ra}
      # operations
      - {id: caiso_dispatch, from: caiso, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *caisomkt}
      - {id: caiso_operates_tx, from: caiso, to: iou, type: operates, asset: transmission, label: operates the transmission the IOU owns, status: needs_verification, source: *tca}
      # bill
      - {id: cpuc_iou_gen, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation rate, status: needs_verification, source: *ra}
      - {id: iou_res_gen, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *ra}
      - {id: ferc_iou_tx, from: ferc, to: iou, type: sets_rate, mode: approves, rate_component: transmission, label: approves transmission revenue requirement, status: needs_verification, source: *tca}
      - {id: iou_res_tx, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: cpuc_iou_dx, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in general rate cases, status: needs_verification, source: *ra}
      - {id: iou_res_dx, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *ra}
      - {id: cpuc_iou_rider, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets public purpose and other non-bypassable charges, status: needs_verification, source: *ra}
      - {id: iou_res_rider, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose charges, status: needs_verification, source: *ra}

  # POUs with their own balancing authority (LADWP; SMUD inside BANC). The CPUC sets none of their rates;
  # their elected board or council does. They trade with CAISO only in its real-time market (WEIM).
  muni_own_ba:
    nodes:
      - id: governing_body
        name: Governing body
        slot: governing_body
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: Elected board or city council that sets the publicly owned utility's retail rates. The CPUC does not.
        source: &pourates {title: CPUC electric rates (publicly owned utilities), url: "https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-rates", accessed: "2026-10-08"}
        status: needs_verification
      - id: pou
        name: POU
        slot: pou
        lane: retail
        kind: muni
        jurisdiction: local
        description: Publicly owned utility. Owns generation, transmission and distribution, and sells to every customer in its area.
        holds_assets: [generation, transmission, distribution]
        source: *pourates
        status: needs_verification
      - id: banc
        name: Balancing authority
        slot: ba
        lane: market_operator
        kind: system_operator
        jurisdiction: local
        description: Balances load and generation for the utility's area. It is outside CAISO's balancing area and runs no energy market.
        source: &weim {title: Western Energy Imbalance Market participants, url: "https://www.westernenergymarkets.com/western-energy-imbalance-market-weim", accessed: "2026-10-08"}
        status: needs_verification
      - id: weim
        name: WEIM
        lane: market_operator
        kind: market
        jurisdiction: supranational
        description: Western Energy Imbalance Market. CAISO's real-time market, joined by balancing authorities across the West.
        source: *weim
        status: needs_verification
      - id: residential
        name: Residential
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household customer of the publicly owned utility. It has no choice of supplier.
    edges:
      - {id: wecc_ba_rel, from: wecc, to: banc, type: regulates, domain: reliability, label: enforces reliability standards on the balancing authority, status: needs_verification, source: *nerc}
      # regulation and operations
      - {id: ferc_caiso_weim, from: ferc, to: caiso, type: regulates, domain: market_rules, label: approves CAISO's tariff including WEIM rules, status: needs_verification, source: *caisomkt}
      - {id: caiso_operates_weim, from: caiso, to: weim, type: operates, label: runs the real-time market, status: needs_verification, source: *weim}
      - {id: caiso_settles_ba, from: caiso, to: banc, type: settles, label: settles the balancing authority's real-time imbalance trades, status: needs_verification, source: *weim}
      - {id: caiso_dispatch_weim, from: caiso, to: generators, type: dispatches, mechanism: central_sced, label: dispatches resources bid into WEIM every 5 minutes, status: needs_verification, source: *weim}
      - {id: ba_balances_pou, from: banc, to: pou, type: dispatches, mechanism: balancing_redispatch, label: balances load and generation in the utility's area, status: needs_verification, source: *weim}
      - {id: cpuc_pou_safety, from: cpuc, to: pou, type: regulates, domain: policy_standard, label: safety oversight only; does not set rates, status: needs_verification, source: *pourates}
      - {id: gov_pou_gov, from: governing_body, to: pou, type: regulates, domain: governance, label: governs the utility and approves its budget, status: needs_verification, source: *pourates}
      # bill: the governing body sets every component; the utility bills it
      - {id: gov_pou_gen, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation rate, status: needs_verification, source: *pourates}
      - {id: pou_res_gen, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: gov_pou_tx, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: transmission, label: sets transmission charges, status: needs_verification, source: *pourates}
      - {id: pou_res_tx, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pourates}
      - {id: gov_pou_dx, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution charges, status: needs_verification, source: *pourates}
      - {id: pou_res_dx, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: gov_pou_rider, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets the public goods charge, status: needs_verification,
         source: {title: "California Public Utilities Code §385 (POU public goods charge)", url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PUC&sectionNum=385", accessed: "2026-10-08"}}
      - {id: pou_res_rider, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}

# Territories: California Energy Commission service-area polygons (scripts/maps/make_maps.mjs fails if two overlap).
utilities:
  PG&E:
    area: CA
    archetypes: [iou_bundled]
    fills:
      iou:
        name: PG&E
        domain_area:
          full: [pge]
          note: PG&E service territory, northern and central California; excludes city-owned utility areas such as SMUD
          source: &cec {title: California Energy Commission electric load serving entities, url: "https://cecgis-caenergy.opendata.arcgis.com/", accessed: "2026-10-08"}
          status: needs_verification
  SCE:
    area: CA
    archetypes: [iou_bundled]
    fills:
      iou:
        name: Southern California Edison
        domain_area:
          full: [sce]
          note: SCE service territory, southern and east-central California; excludes LADWP and other city-owned utilities
          source: *cec
          status: needs_verification
  SDG&E:
    area: CA
    archetypes: [iou_bundled]
    fills:
      iou:
        name: San Diego Gas & Electric
        domain_area:
          full: [sdge]
          note: SDG&E service territory, San Diego County and southern Orange County
          source: *cec
          status: needs_verification
  SMUD:
    area: CA
    archetypes: [muni_own_ba]
    fills:
      governing_body: {name: SMUD Board}
      ba: {name: BANC}
      pou:
        name: SMUD
        owner: {name: Public agency governed by a board elected by voters in its district, type: public, as_of: "2026-10-08",
                source: {title: SMUD Board of Directors, url: "https://www.smud.org/en/Corporate/About-us/Company-Information/Board-of-Directors", accessed: "2026-10-08"}}
        domain_area:
          full: [smud]
          note: SMUD service territory, mostly Sacramento County
          source: *cec
          status: needs_verification
  LADWP:
    area: CA
    archetypes: [muni_own_ba]
    fills:
      governing_body: {name: LA City Council}
      ba: {name: LADWP (BA)}
      pou:
        name: LADWP
        owner: {name: City of Los Angeles, type: municipal, as_of: "2026-10-08",
                source: {title: LADWP electric rates, url: "https://www.ladwp.com/electricrates", accessed: "2026-10-08"}}
        domain_area:
          full: [ladwp]
          note: LADWP service territory, the City of Los Angeles and areas of the Owens Valley
          source: *cec
          status: needs_verification

