schema_version: 2
country: US
market: caiso
name: CAISO
coverage_note: Not all of California is in CAISO's balancing area. LADWP, BANC (incl. SMUD), IID and TID run their own BAs; all but IID trade in CAISO's real-time market (WEIM).
# No central capacity market: resource adequacy (RA) is an obligation on each LSE, and its cost sits inside the
# generation rate as its own line item. Ancillary costs sit inside the generation rate too.
# The PCIA (the exit fee CCA and Direct Access customers pay) is entered as a line item of the non-bypassable
# riders the IOU bills, not as a separate bill component.
bill_components: [generation, transmission, distribution, riders_public_purpose]

base:
  nodes:
    - id: ferc
      name: FERC
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: Regulates CAISO's wholesale markets and the transmission rates of transmission owners under CAISO control.
      domain_area:
        full: [lower48]
        partial: [ercot]
        partial_label: reliability only
        note: Contiguous US; inside ERCOT only reliability standards apply, not wholesale rates or market rules
        source: {title: FERC — ERCOT, url: "https://www.ferc.gov/industries-data/electric/electric-power-markets/ercot", accessed: "2026-10-07"}
        status: needs_verification
    - id: cpuc
      name: CPUC
      lane: regulators
      kind: regulator
      jurisdiction: subnational
      description: California Public Utilities Commission; sets investor-owned utility retail rates and resource adequacy obligations.
      domain_area:
        full: [ca]
        note: California; investor-owned utilities, not city-owned utilities
        source: {title: About the CPUC, url: "https://www.cpuc.ca.gov/about-cpuc", accessed: "2026-10-07"}
        status: needs_verification
    - id: caiso
      name: CAISO
      lane: market_operator
      kind: iso
      jurisdiction: private
      description: Operates the grid and the energy and ancillary service markets for most of California. No central capacity market. Owns no wires.
      domain_area:
        full: [caiso]
        note: Most of California; LADWP, BANC, IID and TID run their own balancing areas (county-level approximation)
        source: {title: EIA-861 2025 service territories and balancing authorities, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-07"}
        status: needs_verification
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Sell energy and ancillary services into CAISO's markets; sell resource adequacy capacity and long-term energy contracts to load-serving entities bilaterally.
      holds_assets: [generation]
      source: {title: EIA-860 generator inventory, url: "https://www.eia.gov/electricity/data/eia860/", accessed: "2026-10-07"}

    - id: nerc
      name: NERC
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Sets reliability standards approved by FERC; enforces them through regional entities.
      domain_area:
        full: [lower48, nerc_canada, mx_bcn]
        note: Contiguous US, most of Canada and northern Baja California (Mexico)
        source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-07"}
        status: needs_verification
    - id: wecc
      name: WECC
      lane: regulators
      kind: reliability_body
      jurisdiction: private
      description: Western Electricity Coordinating Council; NERC's regional entity for the Western Interconnection, including all of California.
      source: {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}
      status: needs_verification
      domain_area:
        full: [re_wecc]
        note: "US part of the Western Interconnection by county (EIA-861); WECC also covers parts of Canada and Baja California"
        source: {title: EIA-861 2025 NERC region by utility, url: "https://www.eia.gov/electricity/data/eia861/", accessed: "2026-10-08"}
        status: needs_verification
  edges:
    # reliability (FPA s.215): FERC approves NERC standards; the regional entity enforces them
    - {id: ferc_nerc_rel, from: ferc, to: nerc, type: regulates, domain: reliability, label: approves reliability standards, status: needs_verification,
       source: &nerc {title: NERC key players, url: "https://www.nerc.com/AboutNERC/keyplayers/Pages/default.aspx", accessed: "2026-10-08"}}
    - {id: nerc_wecc_rel, from: nerc, to: wecc, type: regulates, domain: reliability, label: delegates enforcement, status: needs_verification, source: *nerc}
    - {id: wecc_caiso_rel, from: wecc, to: caiso, type: regulates, domain: reliability, label: enforces reliability standards on CAISO, status: needs_verification, source: *nerc}
    - {id: ferc_caiso, from: ferc, to: caiso, type: regulates, domain: market_rules, label: approves CAISO's tariff and market rules, status: needs_verification,
       source: &caisomkt {title: CAISO market operations, url: "https://www.caiso.com/market-operations", accessed: "2026-10-07"}}
    - {id: caiso_dispatch, from: caiso, to: generators, type: dispatches, mechanism: central_sced, label: dispatches by security-constrained economic dispatch, status: needs_verification, source: *caisomkt}
    # money: CAISO settles its markets and pays generators
    - {id: caiso_pays_gen, from: caiso, to: generators, type: pays, mode: market, rate_component: generation, label: pays generators for energy and ancillary services at market prices, status: needs_verification, source: *caisomkt}

archetypes:
  # Bundled investor-owned utility service (PG&E, SCE, SDG&E): the utility procures generation and the CPUC sets
  # every retail rate. Resource adequacy and ancillary costs are line items inside the generation rate.
  iou_bundled:
    label: Bundled utility service
    nodes:
      - id: iou
        name: IOU
        slot: iou
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Investor-owned utility providing bundled service (generation procurement, wires and billing).
        holds_assets: [generation, transmission, distribution]
        source: &tca {title: CAISO Transmission Control Agreement, url: "https://www.caiso.com/library/transmission-control-agreement", accessed: "2026-10-07"}
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: "Household customer on the IOU's bundled service."}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: "Small business on the IOU's bundled service."}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: "Large commercial or industrial customer on the IOU's bundled time-of-use and demand rates."}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center, usually served at transmission or sub-transmission voltage on the IOU's bundled rates."}
    edges:
      # regulation and planning
      - {id: cpuc_iou, from: cpuc, to: iou, type: regulates, domain: rates, label: regulates retail rates and procurement, status: verified,
         source: &ratecase {title: CPUC general rate case, url: "https://www.cpuc.ca.gov/generalratecase", accessed: "2026-10-08"}}
      - {id: cpuc_ra, from: cpuc, to: iou, type: plans_procures, label: sets the resource adequacy obligation, status: verified,
         source: &ra {title: CPUC resource adequacy, url: "https://www.cpuc.ca.gov/RA", accessed: "2026-10-07"}}
      - {id: caiso_operates_tx, from: caiso, to: iou, type: operates, asset: transmission, label: operates the transmission the IOU owns, status: verified, source: *tca}
      # bill: the generation rate holds two line items, energy procurement and resource adequacy
      - {id: cpuc_iou_gen, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: generation, subcomponent: Energy procurement, label: sets the generation rate that recovers procurement cost, status: needs_verification,
         source: &erra {title: "PG&E 2026 Energy Resource Recovery Account (ERRA) forecast, CPUC A.25-05-011", url: "https://docs.cpuc.ca.gov/PublishedDocs/SupDoc/A2505011/8416/577061825.pdf", accessed: "2026-10-08"}}
      - {id: cpuc_iou_ra, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: generation, subcomponent: Resource adequacy, label: sets the rate that recovers resource adequacy capacity bought to meet the obligation, status: needs_verification, source: *ra}
      - {id: iou_gen_ra, from: iou, to: generators, type: pays, mode: market, rate_component: generation, subcomponent: Resource adequacy, label: buys resource adequacy capacity from generators under bilateral contracts, status: needs_verification, source: *ra}
      - {id: iou_gen_ppa, from: iou, to: generators, type: pays, mode: market, rate_component: generation, subcomponent: Energy procurement, label: pays generators under power purchase contracts recovered in the generation rate, status: needs_verification, source: *erra}
      - {id: iou_caiso_as, from: iou, to: caiso, type: pays, mode: market, rate_component: generation, subcomponent: Energy procurement, label: pays CAISO energy and ancillary service charges, status: needs_verification, source: *caisomkt}
      - {id: ferc_iou_tx, from: ferc, to: iou, type: sets_rate, mode: approves, rate_component: transmission, label: approves the transmission revenue requirement, status: verified,
         source: &ferctx {title: CPUC — electric transmission rates and FERC proceedings, url: "https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-costs/electric-transmission-rates-and-ferc-proceedings", accessed: "2026-10-08"}}
      - {id: cpuc_iou_dx, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in general rate cases, status: verified, source: *ratecase}
      - {id: cpuc_iou_rider, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: iou_res_gen, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *ratecase}
      - {id: iou_res_tx, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iou_res_dx, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iou_res_rider, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: iou_sc_gen, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *ratecase}
      - {id: iou_sc_tx, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iou_sc_dx, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iou_sc_rider, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: iou_lci_gen, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *ratecase}
      - {id: iou_lci_tx, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iou_lci_dx, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iou_lci_rider, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: iou_ll_gen, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *ratecase}
      - {id: iou_ll_tx, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iou_ll_dx, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iou_ll_rider, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}

  # Community choice aggregation: a city or county joint powers authority buys the power, its board sets the
  # generation rate, and the IOU keeps the wires, the billing and the PCIA exit fee.
  iou_cca:
    label: Community choice aggregation
    nodes:
      - id: cca
        name: CCA
        slot: cca
        lane: retail
        kind: cca
        jurisdiction: local
        description: Community choice aggregator (e.g. Clean Power Alliance, Peninsula Clean Energy, San Diego Community Power). A city, county or joint powers authority that buys power for everyone in its area by default; its board sets the generation rate and the CPUC does not.
        source: &cca3662 {title: "California Public Utilities Code § 366.2 (community choice aggregation)", url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PUC&sectionNum=366.2", accessed: "2026-10-08"}
        status: needs_verification
      - id: cca_board
        name: CCA board
        slot: cca_board
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: Officials on the aggregator's governing board, usually elected city or county officials. They set its generation rates; the CPUC has no rate authority over them.
        source: *cca3662
        status: needs_verification
      - id: iou
        name: IOU
        slot: iou
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Investor-owned utility. Keeps the wires and the bill for CCA customers, and collects the PCIA exit fee.
        holds_assets: [transmission, distribution]
        source: *tca
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: "Household enrolled in the community choice aggregator (did not opt out)."}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: "Small business enrolled in the community choice aggregator."}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: "Large commercial or industrial customer enrolled in the community choice aggregator."}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center enrolled in the community choice aggregator."}
    edges:
      - {id: cpuc_iou, from: cpuc, to: iou, type: regulates, domain: rates, label: regulates the IOU's delivery rates and the exit fee, status: verified, source: *ratecase}
      - {id: cpuc_cca_reg, from: cpuc, to: cca, type: regulates, domain: policy_standard, label: registers the aggregator and enforces the renewables portfolio and resource adequacy rules; does not set its rates, status: needs_verification, source: *cca3662}
      - {id: board_cca_gov, from: cca_board, to: cca, type: regulates, domain: governance, label: governs the aggregator and approves its budget, status: needs_verification, source: *cca3662}
      - {id: cpuc_ra_cca, from: cpuc, to: cca, type: plans_procures, label: sets the resource adequacy obligation the aggregator must meet, status: verified, source: *ra}
      - {id: caiso_operates_tx, from: caiso, to: iou, type: operates, asset: transmission, label: operates the transmission the IOU owns, status: verified, source: *tca}
      - {id: cca_caiso_energy, from: cca, to: caiso, type: pays, mode: market, rate_component: generation, label: buys and sells energy in CAISO's markets as a load-serving entity, status: needs_verification, source: *caisomkt}
      - {id: cca_gen_ra, from: cca, to: generators, type: pays, mode: market, rate_component: generation, subcomponent: Resource adequacy, label: buys resource adequacy capacity from generators under bilateral contracts, status: needs_verification, source: *ra}
      # bill: the CCA board sets generation; the IOU bills delivery and the PCIA, both set by the CPUC
      - {id: board_cca_gen, from: cca_board, to: cca, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation rate, status: needs_verification, source: *cca3662}
      - {id: cca_iou_bill, from: cca, to: iou, type: sets_rate, mode: passes_through, rate_component: generation, label: "sends its generation charge to the IOU, which bills it", status: verified, source: *cca3662}
      - {id: ferc_iou_tx, from: ferc, to: iou, type: sets_rate, mode: approves, rate_component: transmission, label: approves the transmission revenue requirement, status: verified, source: *ferctx}
      - {id: cpuc_iou_dx, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in general rate cases, status: verified, source: *ratecase}
      - {id: cpuc_iou_rider, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: cpuc_iou_cam, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, subcomponent: "Cost Allocation Mechanism (CAM)", label: sets the non-bypassable charge for resource adequacy the IOU buys for all customers in its area, status: verified,
         source: &cam {title: "CPUC Report on the 2021-2023 Central Procurement Entity Framework", url: "https://www.cpuc.ca.gov/-/media/cpuc-website/divisions/energy-division/documents/resource-adequacy-homepage/resource-adequacy-compliance-materials/useful-resources/final-report-on-the-2021-2023-cpe-framework.pdf", accessed: "2026-10-08"}}
      - {id: cpuc_iou_pcia, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, subcomponent: "Exit fee (PCIA)", label: sets the Power Charge Indifference Adjustment that recovers the cost of power the IOU bought before the customer left, status: verified,
         source: &pcia {title: CPUC — Power Charge Indifference Adjustment (PCIA), url: "https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-power-procurement/power-charge-indifference-adjustment", accessed: "2026-10-08"}}
      - {id: ioucca_res_gen, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the aggregator's generation charge on its consolidated bill, status: verified, source: *cca3662}
      - {id: ioucca_sc_gen, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the aggregator's generation charge on its consolidated bill, status: verified, source: *cca3662}
      - {id: ioucca_lci_gen, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the aggregator's generation charge on its consolidated bill, status: verified, source: *cca3662}
      - {id: ioucca_ll_gen, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the aggregator's generation charge on its consolidated bill, status: verified, source: *cca3662}
      - {id: ioucca_res_tx, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: ioucca_res_dx, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: ioucca_res_rider, from: iou, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: ioucca_sc_tx, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: ioucca_sc_dx, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: ioucca_sc_rider, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: ioucca_lci_tx, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: ioucca_lci_dx, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: ioucca_lci_rider, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: ioucca_ll_tx, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: ioucca_ll_dx, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: ioucca_ll_rider, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}

  # Direct Access: a non-residential customer buys from an Electric Service Provider. The program is capped by
  # statute (SB 237 raised the cap to about 28,800 GWh) and closed to residential customers, so this setup has
  # no residential class.
  iou_direct_access:
    label: Direct Access
    nodes:
      - id: esp
        name: ESP
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: Electric Service Provider. Sells generation service to non-residential customers inside an IOU's territory under the capped Direct Access program; the CPUC registers it but does not set its prices.
        source: &da {title: CPUC — Direct Access, url: "https://www.cpuc.ca.gov/consumer-support/consumer-programs-and-services/electrical-energy-and-energy-efficiency/community-choice-aggregation-and-direct-access-/direct-access", accessed: "2026-10-08"}
        status: needs_verification
      - id: iou
        name: IOU
        slot: iou
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Investor-owned utility. Keeps the transmission and distribution service for Direct Access customers, and collects the PCIA exit fee.
        holds_assets: [transmission, distribution]
        source: *tca
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: "Small business on Direct Access; residential customers are not eligible."}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: "Large commercial or industrial customer on Direct Access."}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center on Direct Access."}
    edges:
      - {id: cpuc_iou, from: cpuc, to: iou, type: regulates, domain: rates, label: regulates the IOU's delivery rates and the exit fee, status: verified, source: *ratecase}
      - {id: cpuc_esp_lic, from: cpuc, to: esp, type: regulates, domain: licensing, label: registers Electric Service Providers and holds the statewide Direct Access cap, status: verified, source: *da}
      - {id: cpuc_ra_esp, from: cpuc, to: esp, type: plans_procures, label: sets the resource adequacy obligation the provider must meet, status: verified, source: *ra}
      - {id: caiso_operates_tx, from: caiso, to: iou, type: operates, asset: transmission, label: operates the transmission the IOU owns, status: verified, source: *tca}
      - {id: esp_caiso_energy, from: esp, to: caiso, type: pays, mode: market, rate_component: generation, label: buys energy in CAISO's markets as a load-serving entity, status: needs_verification, source: *caisomkt}
      - {id: esp_gen_ra, from: esp, to: generators, type: pays, mode: market, rate_component: generation, subcomponent: Resource adequacy, label: buys resource adequacy capacity from generators under bilateral contracts, status: needs_verification, source: *ra}
      - {id: ferc_iou_tx, from: ferc, to: iou, type: sets_rate, mode: approves, rate_component: transmission, label: approves the transmission revenue requirement, status: verified, source: *ferctx}
      - {id: cpuc_iou_dx, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution rates in general rate cases, status: verified, source: *ratecase}
      - {id: cpuc_iou_rider, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: cpuc_iou_cam, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, subcomponent: "Cost Allocation Mechanism (CAM)", label: sets the non-bypassable charge for resource adequacy the IOU buys for all customers in its area, status: verified, source: *cam}
      - {id: cpuc_iou_pcia, from: cpuc, to: iou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, subcomponent: "Exit fee (PCIA)", label: sets the Power Charge Indifference Adjustment that recovers the cost of power the IOU bought before the customer left, status: verified, source: *pcia}
