      - {id: esp_lci_gen, from: esp, to: large_ci, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation price in its contract, status: needs_verification, source: *da}
      - {id: esp_ll_gen, from: esp, to: large_load, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation price in its contract, status: needs_verification, source: *da}
      - {id: iouda_sc_tx, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iouda_sc_dx, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iouda_sc_rider, from: iou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: iouda_lci_tx, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iouda_lci_dx, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iouda_lci_rider, from: iou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}
      - {id: iouda_ll_tx, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *tca}
      - {id: iouda_ll_dx, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: verified, source: *ratecase}
      - {id: iouda_ll_rider, from: iou, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills public purpose and other non-bypassable charges, status: needs_verification, source: *ratecase}

  # A publicly owned utility inside CAISO's balancing area. Anaheim and Riverside turned their transmission over to
  # CAISO's operational control as participating transmission owners, so FERC approves the transmission rate while
  # the city council still sets every retail rate.
  muni_in_caiso:
    label: City utility inside CAISO
    nodes:
      - id: governing_body
        name: Governing body
        slot: governing_body
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: City council or elected utility board that sets the publicly owned utility's retail rates. The CPUC does not.
        source: &pourates {title: CPUC electric rates (publicly owned utilities), url: "https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-rates", accessed: "2026-10-08"}
        status: needs_verification
      - id: pou
        name: POU
        slot: pou
        lane: retail
        kind: muni
        jurisdiction: local
        description: Publicly owned utility inside CAISO's balancing area. Owns generation, transmission and distribution; its transmission is under CAISO's operational control as a participating transmission owner.
        holds_assets: [generation, transmission, distribution]
        source: &ptoagr {title: CAISO Transmission Control Agreement (participating transmission owners), url: "https://www.caiso.com/library/transmission-control-agreement", accessed: "2026-10-08"}
        status: needs_verification
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: "Household customer of the city utility; it has no choice of supplier."}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: "Small business customer of the city utility."}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: "Large commercial or industrial customer of the city utility."}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center served by the city utility."}
    edges:
      - {id: wecc_pou_rel, from: wecc, to: pou, type: regulates, domain: reliability, label: enforces reliability standards on the utility's transmission, status: needs_verification, source: *nerc}
      - {id: gov_pou_gov, from: governing_body, to: pou, type: regulates, domain: governance, label: governs the utility and approves its budget, status: verified, source: *pourates}
      - {id: cpuc_pou_safety, from: cpuc, to: pou, type: regulates, domain: policy_standard, label: safety oversight only; does not set rates, status: verified, source: *pourates}
      - {id: caiso_operates_tx_pou, from: caiso, to: pou, type: operates, asset: transmission, label: operates the transmission the utility turned over to its control, status: verified, source: *ptoagr}
      - {id: pou_caiso_energy, from: pou, to: caiso, type: pays, mode: market, rate_component: generation, label: buys and sells energy in CAISO's markets as a load-serving entity, status: needs_verification, source: *caisomkt}
      - {id: ferc_pou_tx, from: ferc, to: pou, type: regulates, domain: rates, label: reviews the transmission revenue requirement used in CAISO's Transmission Access Charge, status: needs_verification, source: *ptoagr}
      - {id: gov_pou_tx, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: transmission, label: sets the retail transmission charge, status: needs_verification, source: *pourates}
      # bill: the council sets every retail component; the utility bills them
      - {id: gov_pou_gen, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation rate, status: needs_verification, source: *pourates}
      - {id: gov_pou_dx, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution charges, status: needs_verification, source: *pourates}
      - {id: gov_pou_rider, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets the public goods charge, status: verified,
         source: &pgc {title: "California Public Utilities Code §385 (POU public goods charge)", url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PUC&sectionNum=385", accessed: "2026-10-08"}}
      - {id: mpou_res_gen, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: mpou_res_tx, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *ptoagr}
      - {id: mpou_res_dx, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: mpou_res_rider, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}
      - {id: mpou_sc_gen, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: mpou_sc_tx, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *ptoagr}
      - {id: mpou_sc_dx, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: mpou_sc_rider, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}
      - {id: mpou_lci_gen, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: mpou_lci_tx, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *ptoagr}
      - {id: mpou_lci_dx, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: mpou_lci_rider, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}
      - {id: mpou_ll_gen, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: mpou_ll_tx, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *ptoagr}
      - {id: mpou_ll_dx, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: mpou_ll_rider, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}

  # POUs with their own balancing authority (LADWP; SMUD inside BANC). The CPUC sets none of their rates;
  # their elected board or council does. They trade with CAISO only in its real-time market (WEIM).
  muni_own_ba:
    label: City utility with its own balancing authority
    nodes:
      - id: governing_body
        name: Governing body
        slot: governing_body
        lane: regulators
        kind: legislature
        jurisdiction: local
        description: Elected board or city council that sets the publicly owned utility's retail rates. The CPUC does not.
        source: *pourates
        status: needs_verification
      - id: pou
        name: POU
        slot: pou
        lane: retail
        kind: muni
        jurisdiction: local
        description: Publicly owned utility. Owns generation, transmission and distribution, and sells to every customer in its area.
        holds_assets: [generation, transmission, distribution]
        source: *pourates
        status: needs_verification
      - id: banc
        name: Balancing authority
        slot: ba
        lane: market_operator
        kind: system_operator
        jurisdiction: local
        description: Balances load and generation for the utility's area. It is outside CAISO's balancing area and runs no energy market.
        source: &weim {title: Western Energy Imbalance Market participants, url: "https://www.westernenergymarkets.com/western-energy-imbalance-market-weim", accessed: "2026-10-08"}
        status: needs_verification
      - id: weim
        name: WEIM
        lane: market_operator
        kind: market
        jurisdiction: supranational
        description: Western Energy Imbalance Market. CAISO's real-time market, joined by balancing authorities across the West.
        source: *weim
        status: needs_verification
      - {id: residential, name: Residential, lane: consumers, kind: consumer, jurisdiction: private, description: "Household customer of the publicly owned utility. It has no choice of supplier."}
      - {id: small_commercial, name: Small commercial, lane: consumers, kind: consumer, jurisdiction: private, description: "Small business customer of the publicly owned utility."}
      - {id: large_ci, name: Large commercial & industrial, lane: consumers, kind: consumer, jurisdiction: private, description: "Large commercial or industrial customer of the publicly owned utility."}
      - {id: large_load, name: Large load, lane: consumers, kind: consumer, jurisdiction: private, description: "Very large site such as a data center served by the publicly owned utility."}
    edges:
      - {id: wecc_ba_rel, from: wecc, to: banc, type: regulates, domain: reliability, label: enforces reliability standards on the balancing authority, status: needs_verification, source: *nerc}
      # regulation and operations
      - {id: caiso_operates_weim, from: caiso, to: weim, type: operates, label: runs the real-time market, status: verified, source: *weim}
      - {id: caiso_settles_ba, from: caiso, to: banc, type: settles, label: settles the balancing authority's real-time imbalance trades, status: needs_verification, source: *weim}
      - {id: ba_balances_pou, from: banc, to: pou, type: dispatches, mechanism: balancing_redispatch, label: balances load and generation in the utility's area, status: needs_verification, source: *weim}
      - {id: cpuc_pou_safety, from: cpuc, to: pou, type: regulates, domain: policy_standard, label: safety oversight only; does not set rates, status: verified, source: *pourates}
      - {id: gov_pou_gov, from: governing_body, to: pou, type: regulates, domain: governance, label: governs the utility and approves its budget, status: verified, source: *pourates}
      # bill: the governing body sets every component; the utility bills it
      - {id: gov_pou_gen, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: generation, label: sets the generation rate, status: needs_verification, source: *pourates}
      - {id: gov_pou_tx, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: transmission, label: sets transmission charges, status: needs_verification, source: *pourates}
      - {id: gov_pou_dx, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: distribution, label: sets distribution charges, status: needs_verification, source: *pourates}
      - {id: gov_pou_rider, from: governing_body, to: pou, type: sets_rate, mode: sets, rate_component: riders_public_purpose, label: sets the public goods charge, status: verified, source: *pgc}
      - {id: pou_res_gen, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: pou_res_tx, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pourates}
      - {id: pou_res_dx, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: pou_res_rider, from: pou, to: residential, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}
      - {id: pou_sc_gen, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: pou_sc_tx, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pourates}
      - {id: pou_sc_dx, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: pou_sc_rider, from: pou, to: small_commercial, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}
      - {id: pou_lci_gen, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: pou_lci_tx, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pourates}
      - {id: pou_lci_dx, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: pou_lci_rider, from: pou, to: large_ci, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}
      - {id: pou_ll_gen, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: generation, label: bills the generation rate, status: needs_verification, source: *pourates}
      - {id: pou_ll_tx, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: transmission, label: bills transmission charges, status: needs_verification, source: *pourates}
      - {id: pou_ll_dx, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: distribution, label: bills distribution charges, status: needs_verification, source: *pourates}
      - {id: pou_ll_rider, from: pou, to: large_load, type: sets_rate, mode: passes_through, rate_component: riders_public_purpose, label: bills the public goods charge, status: needs_verification, source: *pourates}

# Territories: California Energy Commission service-area polygons (scripts/maps/make_maps.mjs fails if two overlap).
utilities:
  PG&E:
    area: CA
    archetypes: [iou_bundled, iou_cca, iou_direct_access]
    fills:
      iou:
        name: PG&E
        domain_area:
          full: [pge]
          note: PG&E service territory, northern and central California; excludes city-owned utility areas such as SMUD
          source: &cec {title: California Energy Commission electric load serving entities, url: "https://cecgis-caenergy.opendata.arcgis.com/", accessed: "2026-10-08"}
          status: needs_verification
  SCE:
    area: CA
    archetypes: [iou_bundled, iou_cca, iou_direct_access]
    fills:
      iou:
        name: Southern California Edison
        domain_area:
          full: [sce]
          note: SCE service territory, southern and east-central California; excludes LADWP and other city-owned utilities
          source: *cec
          status: needs_verification
  SDG&E:
    area: CA
    archetypes: [iou_bundled, iou_cca, iou_direct_access]
    fills:
      iou:
        name: San Diego Gas & Electric
        domain_area:
          full: [sdge]
          note: SDG&E service territory, San Diego County and southern Orange County
          source: *cec
          status: needs_verification
  SMUD:
    area: CA
    archetypes: [muni_own_ba]
    fills:
      governing_body: {name: SMUD Board}
      ba: {name: BANC}
      pou:
        name: SMUD
        owner: {name: Public agency governed by a board elected by voters in its district, type: public, as_of: "2026-10-08",
                source: {title: SMUD Board of Directors, url: "https://www.smud.org/en/Corporate/About-us/Company-Information/Board-of-Directors", accessed: "2026-10-08"}}
        domain_area:
          full: [smud]
          note: SMUD service territory, mostly Sacramento County
          source: *cec
          status: needs_verification
  LADWP:
    area: CA
    archetypes: [muni_own_ba]
    fills:
      governing_body: {name: LA City Council}
      ba: {name: LADWP (BA)}
      pou:
        name: LADWP
        owner: {name: City of Los Angeles, type: municipal, as_of: "2026-10-08",
                source: {title: LADWP electric rates, url: "https://www.ladwp.com/electricrates", accessed: "2026-10-08"}}
        domain_area:
          full: [ladwp]
          note: LADWP service territory, the City of Los Angeles and areas of the Owens Valley
          source: *cec
          status: needs_verification
  Anaheim Public Utilities:
    area: CA
    archetypes: [muni_in_caiso]
    fills:
      governing_body: {name: Anaheim City Council}
      pou:
        name: Anaheim Public Utilities
        owner: {name: City of Anaheim, type: municipal, as_of: "2026-10-08",
                source: {title: "FERC order on Anaheim and Riverside transmission turned over to CAISO (Docket EC03-27-000)", url: "https://www.caiso.com/Documents/FERCOrderAuthorizingDisposition-JurisdictionalFacilitiesinDocketNo_EC03-27-000_ISOSchedulingRights_101FERC62_191.pdf", accessed: "2026-10-08"}}
  Riverside Public Utilities:
    area: CA
    archetypes: [muni_in_caiso]
    fills:
      governing_body: {name: Riverside City Council}
      pou:
        name: Riverside Public Utilities
        owner: {name: City of Riverside, type: municipal, as_of: "2026-10-08",
                source: {title: "FERC order on Anaheim and Riverside transmission turned over to CAISO (Docket EC03-27-000)", url: "https://www.caiso.com/Documents/FERCOrderAuthorizingDisposition-JurisdictionalFacilitiesinDocketNo_EC03-27-000_ISOSchedulingRights_101FERC62_191.pdf", accessed: "2026-10-08"}}
