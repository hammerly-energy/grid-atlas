schema_version: 2
country: GB   # ISO 3166 GB covers the whole UK; the gb market below is Great Britain only (NI is in the all-island SEM)
name: Great Britain
currency: GBP
consumer_classes: [residential, small_commercial, large_ci, large_load]
lanes:
  regulators:      {title: POLICY & REGULATION,       subtitle: DESNZ · Ofgem · HM Treasury · Parliament}
  market_operator: {title: SYSTEM & MARKET OPERATION, subtitle: "NESO (balancing, planning) · Elexon (settlement) · LCCC / ESC (levies)"}
  wholesale:       {title: WHOLESALE & TRANSMISSION,  subtitle: generators · storage · interconnectors · NGET / SPT / SHET · OFTOs}
  retail:          {title: DISTRIBUTION & RETAIL,     subtitle: DNO (licence area) · IDNO · supplier}
  consumers:       {title: CONSUMERS,                 subtitle: domestic · small business · large industrial & commercial · transmission-connected}
jurisdiction_labels: {national: UK-wide or GB-wide, subnational: Devolved (Scotland / Wales), local: Local, private: Private}
