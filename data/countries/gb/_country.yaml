glossary:
  NESO: {term: NESO, meaning: "National Energy System Operator; publicly owned since Oct 2024, balances GB in real time, sets TNUoS/BSUoS, plans the network, owns no network assets.", equivalent: {US: ISO/RTO (system operation only; runs no energy market)}}
  Ofgem: {term: Ofgem / GEMA, meaning: "GB energy regulator; licenses, sets network price controls (RIIO) and the default tariff cap.", equivalent: {US: FERC + state PUC}}
  DESNZ: {term: DESNZ, meaning: Department for Energy Security and Net Zero; sets energy policy and the CfD and Capacity Market schemes.}
  Elexon: {term: Elexon, meaning: Administers the Balancing and Settlement Code and settles imbalances; owned by the largest BSC parties since Oct 2024.}
  DNO: {term: DNO, meaning: Distribution Network Operator; owns and runs the local wires in one of 14 licence areas., equivalent: {US: TDSP / EDC}}
  IDNO: {term: IDNO, meaning: Independent distribution network operator; runs embedded networks (often new-build estates) inside a DNO area.}
  Supplier: {term: Supplier, meaning: "Licensed retailer; buys wholesale energy, pays network charges and levies, bills the customer.", equivalent: {US: REP / LSE}}
  TNUoS: {term: TNUoS, meaning: Transmission Network Use of System charge; set by NESO within Ofgem-approved revenue and passed to the TOs.}
  BSUoS: {term: BSUoS, meaning: "Balancing Services Use of System charge; NESO's balancing costs, charged to demand only since Apr 2023."}
  DUoS: {term: DUoS, meaning: Distribution Use of System charge; set by the DNO within Ofgem-approved revenue.}
  CfD: {term: CfD, meaning: "Contracts for Difference; low-carbon support scheme with LCCC as counterparty, funded by a levy on suppliers."}
  RO: {term: RO, meaning: Renewables Obligation; legacy support scheme. From Apr 2026 the Exchequer pays 75% of the domestic cost.}
  Price cap: {term: Default tariff cap, meaning: Ofgem's quarterly ceiling on domestic default tariffs; the supplier sets the actual price at or below it., equivalent: {US: none (closest is PUC-set default service)}}
  NGET: {term: NGET, meaning: "National Grid Electricity Transmission; transmission owner in England and Wales."}
  SPT: {term: SPT, meaning: "SP Transmission (ScottishPower); transmission owner in southern Scotland."}
  SHET: {term: SHET, meaning: "Scottish Hydro Electric Transmission (SSEN Transmission); transmission owner in northern Scotland."}
  OFTO: {term: OFTO, meaning: "Offshore transmission owner; owns the cable from an offshore wind farm to the onshore grid. Licensed by Ofgem through competitive tender."}
  LCCC: {term: LCCC, meaning: "Low Carbon Contracts Company; government-owned counterparty to CfDs. Collects the CfD levy from suppliers."}
  ESC: {term: ESC, meaning: "Electricity Settlements Company; government-owned. Settles Capacity Market payments and collects the supplier charge that funds them."}
  FiT: {term: FiT, meaning: "Feed-in Tariffs; support scheme for small-scale generation, closed to new applicants since Apr 2019. Cost recovered from suppliers."}
  WHD: {term: WHD, meaning: "Warm Home Discount; annual bill rebate for eligible low-income households. Cost spread across supplier bills."}
  RAB: {term: Nuclear RAB, meaning: "Regulated asset base model; funds Sizewell C construction through a levy on suppliers."}
  VAT: {term: VAT, meaning: "Value added tax; domestic electricity 0% from 1 Oct 2026 to 31 Mar 2027 (normally 5%), business 20%."}
  RIIO: {term: RIIO, meaning: "Ofgem's network price-control framework (Revenue = Incentives + Innovation + Outputs); RIIO-3 for transmission from Apr 2026."}
