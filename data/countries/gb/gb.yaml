schema_version: 2
country: GB
market: gb
name: Great Britain (England, Scotland, Wales)
coverage_note: Northern Ireland is in the all-island Single Electricity Market with Ireland, not this market.

# Thin slice: domestic_default_capped, residential only.
base:
  nodes:
    - id: desnz
      name: DESNZ
      lane: regulators
      kind: policy_maker
      jurisdiction: national
      description: Department for Energy Security and Net Zero. Sets energy policy and the CfD, Capacity Market and other levy-funded schemes. NESO's shareholder.
    - id: hm_treasury
      name: HM Treasury
      lane: regulators
      kind: policy_maker
      jurisdiction: national
      description: Sets VAT and Climate Change Levy rates through tax legislation.
    - id: ofgem
      name: Ofgem
      lane: regulators
      kind: regulator
      jurisdiction: national
      description: GB energy regulator. Licenses network companies and suppliers, sets network price controls (RIIO), sets the default tariff cap.
    - id: neso
      name: NESO
      lane: market_operator
      kind: system_operator
      jurisdiction: national
      description: National Energy System Operator. Balances the system in real time and sets TNUoS and BSUoS. Runs no energy market and owns no network assets.
      owner:
        name: Secretary of State for Energy Security and Net Zero
        type: public
        as_of: "2024-10-01"
        source: &nesodesig {title: Designation of NESO, url: "https://www.gov.uk/government/publications/designation-of-the-national-energy-system-operator-neso", accessed: "2026-10-07"}
      status: verified
    - id: elexon
      name: Elexon
      lane: market_operator
      kind: settlement_body
      jurisdiction: national
      description: Administers the Balancing and Settlement Code; settles the difference between what each party contracted and what it metered.
    - id: esc
      name: ESC
      lane: market_operator
      kind: scheme_administrator
      jurisdiction: national
      description: Electricity Settlements Company; government-owned. Settles Capacity Market payments and levies the supplier charge that funds them.
    - id: generators
      name: Generators
      lane: wholesale
      kind: generator
      jurisdiction: private
      description: Self-dispatch against contracts traded bilaterally and on exchanges; no central pool. Pay no BSUoS since Apr 2023.
      holds_assets: [generation]
      source: {title: NESO TNUoS (generator charges), url: "https://www.neso.energy/tnuos-10-minutes-0", accessed: "2026-10-07"}

archetypes:
  domestic_default_capped:
    nodes:
      - id: dno
        name: DNO
        slot: dno
        lane: retail
        kind: wires_utility
        jurisdiction: private
        description: Distribution network operator; owns and runs the local network in one of 14 licence areas.
        holds_assets: [distribution]
        source: &ed2 {title: Ofgem RIIO-ED2 price control, url: "https://www.ofgem.gov.uk/energy-policy-and-regulation/policy-and-regulatory-programmes/network-price-controls-2021-2028-riio-2/riio-ed2-price-control", accessed: "2026-10-07"}
      - id: supplier
        name: Supplier
        lane: retail
        kind: retail_provider
        jurisdiction: private
        description: Licensed supplier. Buys wholesale energy, pays network charges and levies, bills the customer.
      - id: residential
        name: Domestic
        lane: consumers
        kind: consumer
        jurisdiction: private
        description: Household on a standard variable (default) tariff.
    edges:
      # regulation
      - {id: ofgem_neso, from: ofgem, to: neso, type: regulates, domain: licensing, label: licenses NESO, status: needs_verification,
         source: &ofgemlic {title: Ofgem licences and licence conditions, url: "https://www.ofgem.gov.uk/energy-policy-and-regulation/industry-licensing/licences-and-licence-conditions", accessed: "2026-10-07"}}
      - {id: ofgem_dno, from: ofgem, to: dno, type: regulates, domain: rates, label: sets the DNO price control, status: needs_verification, source: *ed2}
      - {id: ofgem_supplier, from: ofgem, to: supplier, type: regulates, domain: licensing, label: licenses suppliers, status: needs_verification, source: *ofgemlic}
      # operations
      - {id: neso_bm, from: neso, to: generators, type: dispatches, mechanism: balancing_redispatch, label: accepts bids and offers in the Balancing Mechanism, status: needs_verification,
         source: &tnuos {title: NESO TNUoS, url: "https://www.neso.energy/tnuos-10-minutes-0", accessed: "2026-10-07"}}
      - {id: elexon_settles, from: elexon, to: supplier, type: settles, label: settles imbalances under the BSC, status: verified,
         source: &bsc {title: Elexon BSC, url: "https://www.elexon.co.uk/bsc/", accessed: "2026-10-07"}}
      # the cap: a ceiling on the whole bill, not a set price
      - {id: ofgem_cap, from: ofgem, to: supplier, type: sets_rate, mode: caps, applies_to: [residential], label: caps default tariffs each quarter, status: verified,
         source: &cap {title: Ofgem energy price cap, url: "https://www.ofgem.gov.uk/energy-price-cap", accessed: "2026-10-07"}}
      # bill
      - {id: sup_res_gen, from: supplier, to: residential, type: sets_rate, mode: sets, rate_component: generation, label: sets the tariff at or below the cap, status: needs_verification, source: *cap}
      - {id: ofgem_neso_tx, from: ofgem, to: neso, type: sets_rate, mode: approves, rate_component: transmission, subcomponent: TNUoS, label: approves transmission owner revenues (RIIO), status: needs_verification, source: *tnuos}
      - {id: neso_sup_tx, from: neso, to: supplier, type: sets_rate, mode: sets, rate_component: transmission, subcomponent: TNUoS, label: sets TNUoS tariffs, status: verified, source: *tnuos}
      - {id: sup_res_tx, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: transmission, subcomponent: TNUoS, label: includes TNUoS in the tariff, status: needs_verification, source: *cap}
      - {id: ofgem_dno_dx, from: ofgem, to: dno, type: sets_rate, mode: approves, rate_component: distribution, subcomponent: DUoS, label: sets DNO allowed revenue (RIIO-ED2), status: needs_verification, source: *ed2}
      - {id: dno_sup_dx, from: dno, to: supplier, type: sets_rate, mode: sets, rate_component: distribution, subcomponent: DUoS, label: sets DUoS tariffs, status: needs_verification, source: *ed2}
      - {id: sup_res_dx, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: distribution, subcomponent: DUoS, label: includes DUoS in the tariff, status: needs_verification, source: *cap}
      - {id: neso_sup_bal, from: neso, to: supplier, type: sets_rate, mode: sets, rate_component: balancing, subcomponent: BSUoS, label: sets BSUoS (charged to demand only), status: verified,
         source: &bsuos {title: NESO BSUoS charges, url: "https://neso.energy/charging/balancing-services-use-system-bsuos-charges", accessed: "2026-10-07"}}
      - {id: sup_res_bal, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: balancing, subcomponent: BSUoS, label: includes BSUoS in the tariff, status: needs_verification, source: *cap}
      - {id: esc_sup_cap, from: esc, to: supplier, type: sets_rate, mode: levies, rate_component: capacity, label: levies the Capacity Market supplier charge, status: needs_verification,
         source: &cm {title: Capacity Market collection, url: "https://www.gov.uk/government/collections/electricity-market-reform-capacity-market", accessed: "2026-10-07"}}
      - {id: sup_res_cap, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: capacity, label: includes the Capacity Market charge in the tariff, status: needs_verification, source: *cap}
      - {id: desnz_sup_levy, from: desnz, to: supplier, type: sets_rate, mode: levies, rate_component: policy_levy, label: "levies scheme costs (CfD, RO, FiT, WHD, Nuclear RAB)", status: needs_verification,
         source: &ea2013 {title: Energy Act 2013, url: "https://www.legislation.gov.uk/ukpga/2013/32/contents", accessed: "2026-10-07"}}
      - {id: sup_res_levy, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: policy_levy, label: includes policy costs in the tariff, status: needs_verification, source: *cap}
      - {id: hmt_sup_vat, from: hm_treasury, to: supplier, type: sets_rate, mode: levies, rate_component: tax, label: "VAT on domestic electricity: 0% from 1 Oct 2026 to 31 Mar 2027, normally 5%", status: verified,
         source: &vat0 {title: Temporary zero rate of VAT for domestic electricity in GB, url: "https://www.gov.uk/government/publications/temporary-zero-rate-of-vat-for-domestic-electricity-in-great-britain/temporary-zero-rate-of-vat-in-great-britain-for-domestic-electricity", accessed: "2026-10-07"}}
      - {id: sup_res_vat, from: supplier, to: residential, type: sets_rate, mode: passes_through, rate_component: tax, label: charges VAT on the bill, status: needs_verification, source: *vat0}
      - {id: sup_res_margin, from: supplier, to: residential, type: sets_rate, mode: sets, rate_component: supplier_margin, label: sets operating cost and margin within the cap, status: needs_verification, source: *cap}

utilities:
  UK Power Networks (London): {area: London, archetypes: [domestic_default_capped], fills: {dno: {name: UK Power Networks (London)}}}
