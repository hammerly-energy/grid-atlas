<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid-atlas</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#9a9a9a; --line:#333; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.note { color:var(--muted); margin:0 0 16px; }
  table { border-collapse:collapse; }
  td, th { border-bottom:1px solid var(--line); padding:4px 12px 4px 0; text-align:left; }
</style>
</head>
<body>
<h1>grid-atlas</h1>
<p class="note">Milestone 1 placeholder: confirms <code>data.js</code> loads (also from file://). The diagram arrives in milestone 2.</p>
<table id="markets"><thead><tr><th>Country</th><th>Market</th><th>Archetypes</th><th>Utilities</th></tr></thead><tbody></tbody></table>
<script src="data.js"></script>
<script>
  const D = window.GRID_ATLAS, tb = document.querySelector('#markets tbody');
  if (!D) { tb.innerHTML = '<tr><td colspan="4">web/data.js missing: run python scripts/build.py</td></tr>'; }
  else for (const [mid, m] of Object.entries(D.markets)) {
    const tr = document.createElement('tr');
    for (const v of [D.countries[m.country].name, m.name, Object.keys(m.archetypes).length, Object.keys(m.utilities).length]) {
      const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
</script>
</body>
</html>
