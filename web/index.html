<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid-atlas</title>
<style>
  :root {
    --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e2e2e2; --lane:#f6f6f4; --node:#fff; --node-line:#c9c9c9;
    --accent:#c2410c; --dim:.18;
    --t-regulates:#2563eb; --t-dispatches:#0f766e; --t-operates:#7c3aed; --t-settles:#b45309; --t-plans_procures:#be185d;
    --t-owns:#7c3aed; --t-sets_rate:#6b6b6b; --t-pays:#6b6b6b; --t-delivers:#6b6b6b;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#121212; --fg:#ececec; --muted:#9c9c9c; --line:#2c2c2c; --lane:#1a1a1a; --node:#202020; --node-line:#3a3a3a;
    --accent:#fb923c;
    --t-regulates:#60a5fa; --t-dispatches:#2dd4bf; --t-operates:#a78bfa; --t-settles:#fbbf24; --t-plans_procures:#f472b6;
    --t-owns:#a78bfa; --t-sets_rate:#9c9c9c; --t-pays:#9c9c9c; --t-delivers:#9c9c9c;
  } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 24px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; background:none; color:var(--fg); padding:5px 12px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 12px; }
  .bar .label { color:var(--muted); margin-right:4px; }
  .chip { border:1px solid var(--line); background:none; color:var(--fg); border-radius:999px; padding:3px 10px; font:inherit; cursor:pointer; }
  .chip[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; max-width:100%; }
  .cols { display:flex; flex-wrap:wrap; gap:16px; }
  .col { flex:1 1 420px; min-width:0; }
  .chain { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .diagram { overflow-x:auto; }
  .diagram svg { min-width:520px; }
  svg { width:100%; height:auto; display:block; }
  .lane-bg { fill:var(--lane); }
  .lane-title { fill:var(--fg); font-size:10.5px; font-weight:600; letter-spacing:.04em; }
  .lane-sub { fill:var(--muted); font-size:10px; }
  .node rect { fill:var(--node); stroke:var(--node-line); }
  .node text { fill:var(--fg); font-size:11.5px; }
  .node .k { fill:var(--muted); font-size:9.5px; }
  .node .u { fill:var(--accent); font-size:9px; }
  .node { cursor:pointer; }
  .node.sel rect { stroke:var(--fg); stroke-width:1.6; }
  .node.on rect { stroke:var(--accent); stroke-width:1.6; }
  .node.off { opacity:var(--dim); }
  .node .asset { fill:none; stroke:var(--t-operates); }
  .node .asset-t { fill:var(--t-operates); font-size:9.5px; }
  .edge { fill:none; stroke-width:1.4; cursor:pointer; }
  .edge.nv { stroke-dasharray:4 3; }
  .edge.on { stroke:var(--accent) !important; stroke-width:2.2; }
  .edge.off { opacity:var(--dim); }
  .edge-hit { fill:none; stroke:transparent; stroke-width:10; cursor:pointer; }
  .cap { fill:none; stroke:var(--accent); stroke-width:1.6; }
  .cap-t { fill:var(--accent); font-size:9.5px; }
  .panel { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-size:13px; }
  .panel h3 { font-size:13px; margin:0 0 4px; }
  .panel dl { display:grid; grid-template-columns:max-content 1fr; gap:2px 10px; margin:0; }
  .panel dt { color:var(--muted); }
  .panel dd { margin:0; }
  .panel a { color:inherit; }
  .dwrap { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:flex-start; }
  .dwrap dl { flex:1 1 240px; }
  .dfig { margin:0; flex:0 0 auto; max-width:220px; }
  .dmap { width:auto; max-width:220px; max-height:150px; }
  .dmap path { stroke:var(--bg); stroke-width:.6; vector-effect:non-scaling-stroke; }
  .dmap .ctx { fill:var(--line); }
  .dmap .base { fill:var(--node-line); }
  .dmap .full { fill:var(--accent); }
  .dmap .hatch-line { stroke:var(--accent); stroke-width:1.2; }
  .dfig figcaption { color:var(--muted); font-size:12px; margin-top:4px; }
  .dfig .sw { display:inline-block; width:10px; height:10px; vertical-align:-1px; margin:0 4px 0 0; }
  .muted { color:var(--muted); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--muted); font-size:12px; margin:12px 0; }
  .legend svg { width:34px; height:10px; display:inline-block; vertical-align:middle; margin-right:4px; }
  .ans { width:100%; border-collapse:collapse; margin:4px 0 10px; font-size:13px; }
  .ans caption { text-align:left; font-weight:600; padding:4px 0; }
  .ans th { text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:2px 8px 2px 0; border-bottom:1px solid var(--line); }
  .ans td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .ans tr.row { cursor:pointer; }
  .ans tr.row:hover td { background:var(--lane); }
  .ans tr.cur td { background:var(--lane); }
  .ans tr.cur td:first-child { box-shadow:inset 3px 0 0 var(--accent); padding-left:6px; }
  .ans .mode { display:inline-block; font-size:11px; padding:0 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .ans .mode.m-caps, .ans .mode.m-approves { border-color:var(--accent); color:var(--accent); }
  .ans .lim { color:var(--muted); font-size:12px; }
  .edge.faint { opacity:.14; }
  footer { color:var(--muted); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>grid-atlas</h1>
  <div class="seg" id="lens" role="group" aria-label="Lens">
    <button data-v="roles">Roles</button><button data-v="bill">Bill</button><button data-v="owner">Ownership</button>
  </div>
</header>
<div class="bar" id="billbar" hidden>
  <span class="label">Class</span><select id="cls"></select>
  <span class="label" style="margin-left:12px">Bill component</span><span id="comps"></span>
</div>
<div class="legend" id="legend"></div>
<div class="cols" id="cols"></div>
<footer id="foot"></footer>

<script src="data.js"></script>
<script>
const D = window.GRID_ATLAS;
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const LANES = ["regulators", "market_operator", "wholesale", "retail", "consumers"];
const KIND_ORDER = ["legislature", "policy_maker", "regulator", "reliability_body", "iso", "system_operator", "market",
  "settlement_body", "scheme_administrator", "generator", "storage", "transmission_owner", "interconnector", "lse",
  "holding_group", "wires_utility", "retail_provider", "cca", "muni", "coop", "consumer"];
const CLASS_ORDER = ["residential", "small_commercial", "large_ci", "large_load"];
const ROLE_TYPES = ["regulates", "dispatches", "operates", "settles", "plans_procures"];
const OWNER_TYPES = ["owns", "operates"];
const MODE_TEXT = { sets: "sets", approves: "approves", caps: "caps", levies: "levies", passes_through: "passes through", market: "market price" };
const W_MIN = 600, LANE_H = 104, TOP = 4, NODE_W = 136, NODE_H = 40, MIN_GAP = 40;
let W = W_MIN;   // grows so the busiest lane keeps MIN_GAP between boxes; set per render, shared by both columns

if (!D) {
  document.body.innerHTML = '<p>web/data.js missing. Run <code>python3 scripts/build.py</code>.</p>';
  throw new Error("no data");
}

/* ---------- state (mirrored in the URL hash) ---------- */
const firstArch = mid => Object.keys(D.markets[mid].archetypes)[0] || "";
const S = { lens: "roles", cls: "residential", comp: "generation", cols: [
  { mid: "ercot", arch: "competitive_area", util: "", sel: null },
  { mid: "", arch: "", util: "", sel: null },
] };
try {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("lens")) S.lens = h.get("lens");
  if (h.get("comp")) S.comp = h.get("comp");
  ["a", "b"].forEach((k, i) => { const v = h.get(k); if (v !== null) { const [mid, arch, ...u] = v.split("/"); S.cols[i].mid = D.markets[mid] ? mid : ""; S.cols[i].arch = arch || firstArch(mid); S.cols[i].util = (D.markets[mid] && D.markets[mid].utilities[u.join("/")]) ? u.join("/") : ""; } });
} catch (e) {}
function saveHash() {
  const p = new URLSearchParams({ lens: S.lens, comp: S.comp, a: [S.cols[0].mid, S.cols[0].arch, S.cols[0].util].filter(Boolean).join("/"), b: `${S.cols[1].mid}/${S.cols[1].arch}${S.cols[1].util ? "/" + S.cols[1].util : ""}` });
  // Safari can refuse replaceState on file:// pages; fall back to a same-page hash change
  try { history.replaceState(null, "", "#" + p); } catch (e) { try { location.replace("#" + p); } catch (e2) {} }
}

/* ---------- data helpers ---------- */
function resolve(mid, arch) {
  const m = D.markets[mid], a = m.archetypes[arch] || {}, drop = new Set(a.removes || []);
  const nodes = [...(m.base.nodes || []), ...(a.nodes || [])].filter(n => !drop.has(n.id));
  const edges = [...(m.base.edges || []), ...(a.edges || [])].filter(e => !drop.has(e.id));
  return { m, nodes, edges, byId: Object.fromEntries(nodes.map(n => [n.id, n])) };
}
const country = mid => D.countries[D.markets[mid].country];
const label = (map, key) => (map && map[key]) || key.replace(/_/g, " ");
function displayName(col, n) {
  const u = col.util && D.markets[col.mid].utilities[col.util];
  const f = u && u.fills && n.slot && u.fills[n.slot];
  return f ? (typeof f === "string" ? f : f.name) : n.name;
}
function domainOf(col, n) {     // a utility's fill can carry its own territory (a DNO area, a wires utility)
  const u = col.util && D.markets[col.mid].utilities[col.util];
  const f = u && u.fills && n.slot && u.fills[n.slot];
  return (f && typeof f === "object" && f.domain_area) || n.domain_area;
}
function utilityType(mid, u) {   // the abbreviation in the kind label of the node the utility fills, e.g. IOU, POU
  const nodes = resolve(mid, u.archetypes[0]).nodes.filter(n => n.lane === "retail" && n.slot && u.fills && u.fills[n.slot]);
  const k = nodes.length ? label(country(mid).kind_labels, nodes[0].kind) : "";
  const ab = k.match(/\(([^)]+)\)/);
  return ab ? ab[1] : k;
}
// switching market, utility or setup keeps the selection: the utility's own box stays selected as the new
// utility's box (Oncor -> CenterPoint, PG&E -> SMUD); any other box or line stays selected if it is still drawn
function utilityBox(mid, arch, uname) {
  const u = uname && D.markets[mid].utilities[uname];
  const n = u && u.fills && resolve(mid, arch).nodes.find(n => n.lane === "retail" && n.slot && u.fills[n.slot]);
  return n ? n.id : null;
}
function hold(col) { col.carry = { ...(col.prev || {}), sel: col.sel }; col.sel = null; }
function carrySel(col, old) {
  if (!old.sel || !col.mid || !col.arch) return null;
  const { byId, edges } = resolve(col.mid, col.arch);
  if (old.sel.edge) return edges.some(e => e.id === old.sel.edge) ? old.sel : null;
  const was = old.mid && utilityBox(old.mid, old.arch, old.util), now = utilityBox(col.mid, col.arch, col.util);
  if (was && old.sel.node === was) return now ? { node: now } : null;
  return byId[old.sel.node] ? old.sel : null;
}
function componentsFor(mid) { return D.markets[mid].bill_components || country(mid).bill_components; }

// Full text, never truncated: shrink the font until the text fits the box (the diagram is in the page, so it can measure)
function fit(t, text, max, min = 7.5) {
  t.textContent = text;
  let fs = parseFloat(getComputedStyle(t).fontSize);
  while (t.getComputedTextLength() > max && fs > min) { fs -= 0.5; t.style.fontSize = fs + "px"; }
  return t;
}

// A name too long for one line at a readable size ("Large commercial & industrial") wraps at the space nearest its middle
function twoLines(g, text, max) {
  const t = el("text", {}, g); t.textContent = text;
  const tooLong = t.getComputedTextLength() > max * 1.2; t.remove();
  if (!tooLong || !text.includes(" ")) return [text];
  const sp = [...text.matchAll(/ /g)].map(m => m.index).sort((a, b) => Math.abs(a - text.length / 2) - Math.abs(b - text.length / 2))[0];
  return [text.slice(0, sp), text.slice(sp + 1)];
}

/* ---------- layout ---------- */
// Box order within each lane: start from kind order, then reorder each lane to minimise the total horizontal
// length of all relationships (a line inside one lane counts double, since it has to loop out and back).
// Uses every edge, not just the lens's, so boxes stay put when the lens changes. Deterministic: ties keep the order.
function layout(nodes, edges = []) {
  const order = LANES.map(lane => nodes.filter(n => n.lane === lane)
    .sort((a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || CLASS_ORDER.indexOf(a.id) - CLASS_ORDER.indexOf(b.id) || a.id.localeCompare(b.id)).map(n => n.id));
  const laneOf = Object.fromEntries(order.flatMap((ids, li) => ids.map(id => [id, li])));
  const es = edges.filter(e => e.from in laneOf && e.to in laneOf && e.from !== e.to);
  const slotX = (ids, i) => { const gap = (W - ids.length * NODE_W) / (ids.length + 1); return gap + i * (NODE_W + gap); };
  const xs = () => Object.fromEntries(order.flatMap(ids => ids.map((id, i) => [id, slotX(ids, i)])));
  // same-lane lines (FERC → NERC → Texas RE) cost most: neighbours get a short straight line, in reading order
  const cost = x => es.reduce((c, e) => {
    const d = Math.abs(x[e.from] - x[e.to]);
    if (laneOf[e.from] !== laneOf[e.to]) return c + d;
    const ids = order[laneOf[e.from]], apart = Math.abs(ids.indexOf(e.from) - ids.indexOf(e.to));
    return c + 4 * d + (apart > 1 ? W : 0) + (x[e.from] > x[e.to] ? NODE_W : 0);
  }, 0);
  const perms = a => a.length <= 1 ? [a] : a.flatMap((v, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [v, ...p]));
  for (let pass = 0; pass < 3; pass++) {
    let moved = false;
    order.forEach((ids, li) => {
      if (ids.length < 2 || ids.length > 7 || LANES[li] === "consumers") return;   // consumer classes keep their order, smallest to largest
      let best = ids, bestCost = cost(xs());
      for (const p of perms(ids)) {
        order[li] = p; const c = cost(xs());
        if (c < bestCost - 1e-6) { best = p; bestCost = c; moved = true; }
      }
      order[li] = best;
    });
    if (!moved) break;
  }
  const pos = {};
  order.forEach((ids, li) => ids.forEach((id, i) => { pos[id] = { x: slotX(ids, i), y: TOP + li * LANE_H + 40, lane: li }; }));
  return pos;
}
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
/* ---------- routing: one port per line on each box, detours through gaps ---------- */
const LEAD = 12;   // straight run out of and into each box, so the arrowhead lines up with the line
const rowTop = li => TOP + li * LANE_H + 40, rowBottom = li => rowTop(li) + NODE_H;
function freeGaps(pos, li) {
  const boxes = Object.values(pos).filter(p => p.lane === li).map(p => [p.x - 12, p.x + NODE_W + 12]).sort((a, b) => a[0] - b[0]);
  const gaps = []; let x = 8;
  for (const [a, b] of boxes) { if (a > x) gaps.push([x, a]); x = Math.max(x, b); }
  if (x < W - 8) gaps.push([x, W - 8]);
  return gaps;
}
function route(shown, pos) {
  const plan = shown.filter(e => pos[e.from] && pos[e.to]).map(e => {
    const a = pos[e.from], b = pos[e.to], dir = Math.sign(b.lane - a.lane);
    // neighbours in one lane: straight across the gap, side to side
    const side = !dir && !Object.values(pos).some(p => p.lane === a.lane && p.x > Math.min(a.x, b.x) && p.x < Math.max(a.x, b.x));
    if (side) return { e, a, b, dir, side, sa: a.x < b.x ? "right" : "left", sb: a.x < b.x ? "left" : "right" };
    return { e, a, b, dir, sa: dir < 0 ? "top" : "bottom", sb: dir > 0 ? "top" : "bottom" };
  });
  // ports: spread every line's end along the box side, ordered by where the line is heading
  const ends = {};
  for (const r of plan) {
    (ends[`${r.e.from}|${r.sa}`] ||= []).push({ r, end: "ax", toward: r.b.x });
    (ends[`${r.e.to}|${r.sb}`] ||= []).push({ r, end: "bx", toward: r.a.x });
  }
  const u0side = key => /\|(left|right)$/.test(key);
  for (const [key, list] of Object.entries(ends)) {
    const p = pos[key.split("|")[0]];
    list.sort((u, v) => u.toward - v.toward || u.r.e.id.localeCompare(v.r.e.id));
    if (u0side(key)) { list.sort((u, v) => u.r.e.id.localeCompare(v.r.e.id)); list.forEach((u, i) => { u.r[u.end + "y"] = p.y + NODE_H * (i + 1) / (list.length + 1); }); continue; }
    list.forEach((u, i) => { u.r[u.end] = p.x + NODE_W * (i + 1) / (list.length + 1); });
  }
  // lines that skip a lane pass through a gap between that lane's boxes; lines sharing a gap are spaced apart
  const inGap = {};
  for (const r of plan) {
    r.via = [];
    if (r.side) continue;
    for (let li = r.a.lane + r.dir; r.dir && li !== r.b.lane; li += r.dir) {
      const want = r.ax + (r.bx - r.ax) * (li - r.a.lane) / (r.b.lane - r.a.lane);
      let best = null, bd = Infinity;
      for (const g of freeGaps(pos, li)) { const d = want < g[0] ? g[0] - want : want > g[1] ? want - g[1] : 0; if (d < bd) { bd = d; best = g; } }
      const v = { li, want, gap: best }; r.via.push(v);
      (inGap[`${li}|${best[0]}`] ||= []).push(v);
    }
  }
  for (const list of Object.values(inGap)) {
    const [g0, g1] = list[0].gap;
    list.sort((u, v) => u.want - v.want);
    list.forEach((v, i) => { v.x = Math.min(Math.max(v.want, g0 + 8), g1 - 8); if (i) v.x = Math.max(v.x, list[i - 1].x + 12); });
    const over = list[list.length - 1].x - (g1 - 8);
    if (over > 0) list.forEach(v => { v.x = Math.max(g0 + 4, v.x - over); });
  }
  const d = {};
  for (const r of plan) {
    if (r.side) {
      const x1 = r.sa === "right" ? r.a.x + NODE_W : r.a.x, x2 = r.sb === "right" ? r.b.x + NODE_W : r.b.x, s = Math.sign(x2 - x1);
      d[r.e.id] = `M${x1},${r.axy} L${x1 + LEAD * s},${r.axy} C${(x1 + x2) / 2},${r.axy} ${(x1 + x2) / 2},${r.bxy} ${x2 - LEAD * s},${r.bxy} L${x2},${r.bxy}`; continue;
    }
    const y1 = r.sa === "bottom" ? r.a.y + NODE_H : r.a.y, y2 = r.sb === "bottom" ? r.b.y + NODE_H : r.b.y;
    if (!r.dir) {   // same lane: arc under the row, deeper for longer spans
      const dep = 16 + Math.abs(r.bx - r.ax) * 0.08;
      d[r.e.id] = `M${r.ax},${y1} L${r.ax},${y1 + LEAD} C${r.ax},${y1 + dep} ${r.bx},${y2 + dep} ${r.bx},${y2 + LEAD} L${r.bx},${y2}`; continue;
    }
    const pts = [[r.ax, y1], [r.ax, y1 + LEAD * r.dir]];
    for (const v of r.via) {
      const [ya, yb] = r.dir > 0 ? [rowTop(v.li) - 6, rowBottom(v.li) + 6] : [rowBottom(v.li) + 6, rowTop(v.li) - 6];
      pts.push([v.x, ya], [v.x, yb]);
    }
    pts.push([r.bx, y2 - LEAD * r.dir], [r.bx, y2]);
    let s = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x, y] = pts[i];
      if (x0 === x) s += ` L${x},${y}`;
      else { const m = (y0 + y) / 2; s += ` C${x0},${m} ${x},${m} ${x},${y}`; }
    }
    d[r.e.id] = s;
  }
  return d;
}

/* ---------- markers: arrowhead shape encodes mode ---------- */
const MARKERS = {
  arrow: "M0,0 L8,4 L0,8 z", hollow: "M0,0 L8,4 L0,8 z", diamond: "M0,4 L4,0 L8,4 L4,8 z", square: "M1,1 L7,1 L7,7 L1,7 z", dot: "M4,1.5 A2.5,2.5 0 1 1 3.99,1.5 z",
};
const MODE_SHAPE = { sets: "arrow", approves: "hollow", levies: "square", market: "diamond", passes_through: "dot" };
function marker(defs, shape, color, key) {
  const id = `m-${shape}-${key}`;
  if (!defs.querySelector("#" + id)) {
    const mk = el("marker", { id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: MARKERS[shape], fill: shape === "hollow" ? "var(--bg)" : color, stroke: color, "stroke-width": 1 }, mk);
  }
  return `url(#${id})`;
}

/* ---------- column render ---------- */
function otherKinds(i) {
  const o = S.cols[1 - i];
  if (!o.mid || !S.cols[i].mid) return null;
  return new Set(resolve(o.mid, o.arch).nodes.map(n => n.kind));
}

function renderCol(i) {
  const col = S.cols[i], box = $(`#col${i}`);
  const markets = Object.entries(D.markets);
  box.innerHTML = "";
  const chain = document.createElement("div"); chain.className = "chain"; box.appendChild(chain);

  const mSel = document.createElement("select");
  mSel.setAttribute("aria-label", "Market");
  if (i === 1) mSel.add(new Option("Compare with…", ""));
  for (const cc of Object.keys(D.countries)) {
    const g = document.createElement("optgroup"); g.label = D.countries[cc].name;
    markets.filter(([, m]) => m.country === cc).forEach(([mid, m]) => g.appendChild(new Option(m.name, mid)));
    mSel.appendChild(g);
  }
  mSel.value = col.mid;
  mSel.onchange = () => { col.mid = mSel.value; col.arch = col.mid ? firstArch(col.mid) : ""; col.util = ""; hold(col); render(); };   // render picks the first utility
  chain.appendChild(mSel);
  if (!col.mid) return;

  const m = D.markets[col.mid], C = country(col.mid);
  const utils = Object.entries(m.utilities);
  pickUtility(col);
  if (utils.length) {      // one list of named utilities; the setup follows from the utility
    const uSel = document.createElement("select"); uSel.setAttribute("aria-label", C.chain[1] || "Utility");
    utils.forEach(([name, u]) => uSel.add(new Option(`${name} [${u.area}] (${utilityType(col.mid, u)})`, name)));
    uSel.value = col.util;
    uSel.onchange = () => { col.util = uSel.value; col.arch = m.utilities[col.util].archetypes[0]; hold(col); render(); };
    chain.appendChild(uSel);
  }
  const archs = utils.length ? m.utilities[col.util].archetypes : Object.keys(m.archetypes);
  if (archs.length !== 1) {   // a supply choice only when the utility offers more than one setup
    const aSel = document.createElement("select"); aSel.setAttribute("aria-label", C.chain[2] || "Setup");
    if (!archs.length) aSel.add(new Option("No setups entered", ""));
    archs.forEach(a => aSel.add(new Option(a.replace(/_/g, " "), a)));
    aSel.value = col.arch;
    aSel.onchange = () => { col.arch = aSel.value; hold(col); render(); };
    chain.appendChild(aSel);
  }

  if (!col.arch) return;

  const { nodes, edges, byId } = resolve(col.mid, col.arch);
  box.appendChild(answers(col, C, nodes, edges, byId));
  const focus = focusEdges(col, edges);
  const pos = layout(nodes, edges);
  const svg = el("svg", { viewBox: `0 0 ${W} ${TOP + LANES.length * LANE_H}`, role: "img", "aria-label": `${m.name} ${col.arch.replace(/_/g, " ")}` });
  const wrap = document.createElement("div"); wrap.className = "diagram"; wrap.appendChild(svg); box.appendChild(wrap);
  const defs = el("defs", {}, svg);

  LANES.forEach((lane, li) => {
    const y = TOP + li * LANE_H;
    el("rect", { class: "lane-bg", x: 0, y, width: W, height: LANE_H - 4, rx: 4 }, svg);
    el("text", { class: "lane-title", x: 8, y: y + 14 }, svg).textContent = C.lanes[lane].title;
    el("text", { class: "lane-sub", x: 8, y: y + 27 }, svg).textContent = C.lanes[lane].subtitle || "";
  });

  // which edges and nodes this lens shows
  let shown, path = new Set(), active = new Set(), ans = null, caps = [];
  if (S.lens === "roles") shown = edges.filter(e => ROLE_TYPES.includes(e.type));
  else if (S.lens === "owner") shown = edges.filter(e => OWNER_TYPES.includes(e.type));
  else {
    shown = edges.filter(e => (e.type === "sets_rate" || e.type === "pays") && e.rate_component === S.comp && e.mode !== "caps"
      && (!e.applies_to || e.applies_to.includes(S.cls)));
    ans = D.answers[`${col.mid}|${col.arch}|${S.cls}|${S.comp}`] || null;
    if (ans) { ans.path.forEach(id => path.add(id)); ans.limits.forEach(id => path.add(id)); }
    edges.filter(e => path.has(e.id)).forEach(e => { active.add(e.from); active.add(e.to); });
    caps = edges.filter(e => e.mode === "caps" && (!e.applies_to || e.applies_to.includes(S.cls))
      && (!e.rate_component || e.rate_component === S.comp) && active.has(e.to));
    shown = shown.concat(edges.filter(e => path.has(e.id) && !shown.includes(e)));
  }

  // edges
  const paths = route(shown, pos);
  for (const e of shown) {
    const d = paths[e.id];
    if (!d) continue;
    const color = S.lens === "bill" ? "var(--t-sets_rate)" : `var(--t-${e.type})`;
    const on = path.has(e.id) || (focus && focus.has(e.id)), off = S.lens === "bill" && ans && !on;
    const faint = S.lens !== "bill" && !(focus && focus.has(e.id));
    const shape = S.lens === "bill" ? (MODE_SHAPE[e.mode || "sets"] || "arrow") : "arrow";
    const hl = on && S.lens === "bill";
    const p = el("path", { d, class: `edge${e.status === "verified" ? "" : " nv"}${on && S.lens === "bill" ? " on" : ""}${off ? " off" : ""}${faint ? " faint" : ""}`, stroke: color,
      "marker-end": marker(defs, shape, hl ? "var(--accent)" : color, hl ? "on" : e.type) }, svg);
    const hit = el("path", { d, class: "edge-hit", "data-edge": e.id, "data-from": e.from, "data-to": e.to }, svg);
    const t = el("title", {}, hit); t.textContent = `${byId[e.from].name} → ${byId[e.to].name}: ${e.label}\nSource: ${e.source.title} (${e.status === "verified" ? "verified" : "needs verification"})`;
    hit.onclick = () => { col.sel = { edge: e.id }; render(); };
    p.onclick = hit.onclick;
  }

  // nodes
  const kindsElsewhere = otherKinds(i);
  for (const n of nodes) {
    const p = pos[n.id], name = displayName(col, n);
    const sel = col.sel && col.sel.node === n.id;
    const g = el("g", { class: `node${sel ? " sel" : ""}${(active.has(n.id) || (focus && focus.nodes.has(n.id) && !(col.sel && col.sel.node === n.id))) ? " on" : ""}${S.lens === "bill" && ans && !active.has(n.id) ? " off" : ""}`,
      transform: `translate(${p.x},${p.y})`, "data-id": n.id, tabindex: 0, role: "button", "aria-label": name }, svg);
    el("rect", { width: NODE_W, height: NODE_H, rx: 5 }, g);
    const lines = twoLines(g, name, NODE_W - 16);
    lines.forEach((ln, k) => fit(el("text", { x: 8, y: lines.length > 1 ? 13 + 11 * k : 16 }, g), ln, NODE_W - 16));
    fit(el("text", { x: 8, y: lines.length > 1 ? 36 : 30, class: "k" }, g), label(C.kind_labels, n.kind), NODE_W - 16);
    if (kindsElsewhere && !kindsElsewhere.has(n.kind)) el("text", { x: NODE_W, y: NODE_H + 11, class: "u", "text-anchor": "end" }, g).textContent = "only here";
    if (S.lens === "owner" && n.holds_assets && n.holds_assets.length) {
      el("rect", { class: "asset", x: -3, y: -3, width: NODE_W + 6, height: NODE_H + 6, rx: 7 }, g);
      el("text", { class: "asset-t", x: 0, y: NODE_H + 13 }, g).textContent = "owns " + n.holds_assets.map(a => a.replace(/_/g, " ")).join(", ");
    }
    if (S.lens === "owner" && n.owner) el("text", { class: "asset-t", x: 0, y: NODE_H + (n.holds_assets && n.holds_assets.length ? 25 : 13) }, g).textContent = "owned by " + n.owner.name.replace(/^Secretary of State for /, "SoS ");
    g.onclick = () => { col.sel = { node: n.id }; render(); };
    g.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); g.onclick(); } };
  }

  // the cap: a bracket around the setter it limits
  for (const c of caps) {
    const p = pos[c.to]; if (!p) continue;
    el("path", { class: "cap", d: `M${p.x - 8},${p.y - 6} h-4 v${NODE_H + 12} h4 M${p.x + NODE_W + 8},${p.y - 6} h4 v${NODE_H + 12} h-4` }, svg);
    el("text", { class: "cap-t", x: p.x + NODE_W + 16, y: p.y + 24 }, svg).textContent = `cap: ${byId[c.from].name}`;
  }

  box.appendChild(panel(col, C, byId, edges, ans));
}

/* ---------- answer table: the question first, the diagram second ---------- */
const GROUP_TEXT = { "regulates|rates": "Sets or approves rates", "regulates|market_rules": "Writes market rules", "regulates|reliability": "Enforces reliability standards",
  "regulates|licensing": "Licenses / certifies", "regulates|governance": "Oversees governance", "regulates|policy_standard": "Sets policy standards",
  "dispatches|": "Dispatches power plants", "operates|": "Operates grid or market", "settles|": "Settles payments", "plans_procures|": "Plans / procures capacity" };
const groupKey = e => `${e.type}|${e.type === "regulates" ? e.domain || "" : ""}`;
const groupLabel = k => GROUP_TEXT[k] || k.replace(/[|_]/g, " ");
function focusEdges(col, edges) {
  if (!col.sel) return null;
  let es = [];
  if (col.sel.group) es = edges.filter(e => groupKey(e) === col.sel.group);
  else if (col.sel.node) es = edges.filter(e => e.from === col.sel.node || e.to === col.sel.node);
  else if (col.sel.edge) es = edges.filter(e => e.id === col.sel.edge);
  const s = new Set(es.map(e => e.id)); s.nodes = new Set(es.flatMap(e => [e.from, e.to])); return s;
}
function answers(col, C, nodes, edges, byId) {
  const t = document.createElement("table"); t.className = "ans";
  const nm = id => esc(displayName(col, byId[id]));
  const names = ids => [...new Set(ids)].map(nm).join(", ");
  if (S.lens === "bill") {
    t.innerHTML = `<caption>Who sets each part of a ${esc(S.cls.replace(/_/g, " "))} bill</caption><tr><th>Part of bill</th><th>Set by</th><th>Limited by</th></tr>`;
    for (const c of componentsFor(col.mid)) {
      const a = D.answers[`${col.mid}|${col.arch}|${S.cls}|${c}`];
      const tr = document.createElement("tr"); tr.className = "row" + (c === S.comp ? " cur" : "");
      const lim = a ? a.limits.map(id => edges.find(e => e.id === id)).map(e => `${nm(e.from)} ${esc(MODE_TEXT[e.mode] || e.mode)}`) : [];
      tr.innerHTML = `<td>${esc(label(C.component_labels, c))}</td><td>${a ? `${nm(a.setter)} <span class="mode m-${a.mode}">${esc(MODE_TEXT[a.mode])}</span>` : '<span class="muted">not entered</span>'}</td><td class="lim">${lim.join("<br>") || "—"}</td>`;
      tr.onclick = () => { S.comp = c; render(); };
      t.appendChild(tr);
    }
    const onPath = new Set(componentsFor(col.mid).flatMap(c => { const a = D.answers[`${col.mid}|${col.arch}|${S.cls}|${c}`]; return a ? a.path.flatMap(id => { const e = edges.find(x => x.id === id); return [e.from, e.to]; }) : []; }));
    const whole = edges.filter(e => e.mode === "caps" && !e.rate_component && onPath.has(e.to) && (!e.applies_to || e.applies_to.includes(S.cls)));
    if (whole.length) { const tr = document.createElement("tr"); tr.innerHTML = `<td>Whole bill</td><td colspan="2">${whole.map(e => `${nm(e.from)} <span class="mode m-caps">caps</span>`).join(" ")}</td>`; t.appendChild(tr); }
    return t;
  }
  if (S.lens === "roles") {
    t.innerHTML = `<tr><th>Role</th><th>Who</th><th>Over</th></tr>`;
    const groups = {};
    edges.filter(e => ROLE_TYPES.includes(e.type)).forEach(e => (groups[groupKey(e)] ||= []).push(e));
    const order = Object.keys(GROUP_TEXT), o = S.cols[1 - S.cols.indexOf(col)];
    if (o.mid && o.arch) resolve(o.mid, o.arch).edges.filter(e => ROLE_TYPES.includes(e.type)).forEach(e => { groups[groupKey(e)] ||= []; });   // rows line up across columns; a missing role reads "none entered"
    for (const k of Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b))) {
      const es = groups[k], tr = document.createElement("tr");
      tr.className = "row" + (col.sel && col.sel.group === k ? " cur" : "");
      if (!es.length) { tr.className = ""; tr.innerHTML = `<td>${esc(groupLabel(k))}</td><td class="muted">none entered</td><td></td>`; t.appendChild(tr); continue; }
      tr.innerHTML = `<td>${esc(groupLabel(k))}</td><td>${names(es.map(e => e.from))}</td><td class="lim">${names(es.map(e => e.to))}</td>`;
      tr.onclick = () => { col.sel = col.sel && col.sel.group === k ? null : { group: k }; render(); };
      t.appendChild(tr);
    }
    return t;
  }
  t.innerHTML = `<caption>Who owns which part of the grid</caption><tr><th>Who</th><th>Owns</th><th>Owned by</th></tr>`;
  for (const n of nodes.filter(n => (n.holds_assets && n.holds_assets.length) || n.owner)) {
    const tr = document.createElement("tr"); tr.className = "row" + (col.sel && col.sel.node === n.id ? " cur" : "");
    tr.innerHTML = `<td>${nm(n.id)}</td><td>${n.holds_assets && n.holds_assets.length ? esc(n.holds_assets.map(a => a.replace(/_/g, " ")).join(", ")) : "nothing"}</td><td class="lim">${n.owner ? esc(n.owner.name) + " (" + esc(n.owner.type.replace(/_/g, " ")) + ")" : "—"}</td>`;
    tr.onclick = () => { col.sel = { node: n.id }; render(); };
    t.appendChild(tr);
  }
  const none = nodes.filter(n => ["iso", "system_operator"].includes(n.kind) && !(n.holds_assets || []).length);
  if (none.length) { const tr = document.createElement("tr"); tr.innerHTML = `<td>${names(none.map(n => n.id))}</td><td>nothing (operates, does not own)</td><td class="lim">—</td>`; t.appendChild(tr); }
  return t;
}

/* ---------- domain map: where a body's authority applies ---------- */
let mapSeq = 0;
function domainMap(da, cc, home) {
  const M = D.maps && Object.values(D.maps).find(m => cc in m.countries); if (!M) return "";
  const expand = ids => (ids || []).flatMap(id => (M.groups || {})[id] || [id]);
  const full = new Set(expand(da.full)), part = new Set(expand(da.partial));
  // frame: the home area (the country, or a utility's state when it is a map area) plus the body's own areas, padded
  const b = [...expand([home in M.bbox ? home : M.countries[cc]]), ...full, ...part].map(a => M.bbox[a]).filter(Boolean)
    .reduce((u, q) => [Math.min(u[0], q[0]), Math.min(u[1], q[1]), Math.max(u[2], q[2]), Math.max(u[3], q[3])], [Infinity, Infinity, -Infinity, -Infinity]);
  const pad = 0.04 * Math.max(b[2] - b[0], b[3] - b[1]);
  const vb = [b[0] - pad, b[1] - pad, b[2] - b[0] + 2 * pad, b[3] - b[1] + 2 * pad].map(v => +v.toFixed(1));
  const hid = `hatch${mapSeq++}`;
  const hatch = `<pattern id="${hid}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="4" height="4" fill="var(--bg)"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="4"/></pattern>`;
  let paths = "";
  for (const l of M.layers) for (const [id, d] of Object.entries(l.areas)) {
    const c = full.has(id) ? "full" : part.has(id) ? "part" : l.id === "context" ? "ctx" : "base";
    if (l.overlay && c !== "full" && c !== "part") continue;     // overlay layers draw only the areas in play
    paths += `<path class="${c}" data-area="${id}" d="${d}"${c === "part" ? ` fill="url(#${hid})"` : ""}/>`;
  }
  const key = da.partial && da.partial.length
    ? `<br><span class="sw" style="background:var(--accent)"></span>full role <span class="sw" style="background:repeating-linear-gradient(45deg,var(--accent) 0 1.5px,var(--bg) 1.5px 4px)"></span>${esc(da.partial_label)}` : "";
  return `<figure class="dfig"><svg class="dmap" viewBox="${vb.join(" ")}" role="img" aria-label="${esc(da.note)}"><defs>${hatch}</defs>${paths}</svg>
    <figcaption>${esc(da.note)}${key}</figcaption></figure>`;
}

/* ---------- detail panel: facts and sources only ---------- */
function srcLink(s) { return s ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a> <span class="muted">(${s.accessed})</span>` : "—"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function gloss(C, name) {
  const g = Object.values(C.glossary).find(g => g.term === name || g.term.split(" / ").includes(name));
  return g ? g.meaning : null;
}
function panel(col, C, byId, edges, ans) {
  const p = document.createElement("div"); p.className = "panel";
  const nm = id => esc(displayName(col, byId[id]));
  if (S.lens === "bill") {
    const cl = label(C.component_labels, S.comp);
    if (!componentsFor(col.mid).includes(S.comp)) p.innerHTML = `<h3>${esc(cl)}</h3><p class="muted">Not entered as a separate component in ${esc(D.markets[col.mid].name)}.</p>`;
    else if (!ans) p.innerHTML = `<h3>${esc(cl)}</h3><p class="muted">No path entered for ${esc(S.cls.replace(/_/g, " "))}.</p>`;
    else {
      const chain = [ans.setter, ...ans.path.slice().reverse().map(id => edges.find(e => e.id === id).to)];
      const uniq = chain.filter((x, k) => chain.indexOf(x) === k);
      const lim = ans.limits.map(id => edges.find(e => e.id === id)), whole = (ans.whole_bill_caps || []).map(id => edges.find(e => e.id === id));
      const limits = lim.map(e => `${nm(e.from)}: ${esc(e.label)}`);
      p.innerHTML = `<h3>${esc(cl)}</h3><dl>
        <dt>Set by</dt><dd>${nm(ans.setter)} (${MODE_TEXT[ans.mode]})</dd>
        <dt>Path</dt><dd>${uniq.map(nm).join(" → ")}</dd>
        <dt>Limited by</dt><dd>${limits.join("<br>") || "—"}</dd>
        ${whole.length ? `<dt>Whole bill</dt><dd>${whole.map(e => `${nm(e.from)}: ${esc(e.label)}`).join("<br>")}</dd>` : ""}
        <dt>Sources</dt><dd>${[...ans.path.map(id => edges.find(e => e.id === id)), ...lim, ...whole].map(e => srcLink(e.source)).join("<br>")}</dd></dl>`;
    }
    return p;
  }
  if (col.sel && col.sel.group) {
    const es = edges.filter(e => groupKey(e) === col.sel.group);
    p.innerHTML = `<h3>${esc(groupLabel(col.sel.group))}</h3><dl>${es.map(e => `<dt>${nm(e.from)} → ${nm(e.to)}</dt><dd>${esc(e.label)} · ${srcLink(e.source)}</dd>`).join("")}</dl>`;
    return p;
  }
  if (col.sel && col.sel.edge) {
    const e = edges.find(x => x.id === col.sel.edge);
    if (e) p.innerHTML = `<h3>${nm(e.from)} → ${nm(e.to)}</h3><dl>
      <dt>Relation</dt><dd>${esc(e.label)}</dd>
      <dt>Type</dt><dd>${esc(e.type.replace(/_/g, " "))}${e.domain ? " · " + esc(e.domain.replace(/_/g, " ")) : ""}${e.mechanism ? " · " + esc(e.mechanism.replace(/_/g, " ")) : ""}${e.asset ? " · " + esc(e.asset) : ""}</dd>
      <dt>Status</dt><dd>${e.status === "verified" ? "verified" : "needs verification"}</dd>
      <dt>Source</dt><dd>${srcLink(e.source)}</dd></dl>`;
    return p;
  }
  if (col.sel && col.sel.node && byId[col.sel.node]) {
    const n = byId[col.sel.node], g = gloss(C, n.name);
    const lines = edges.filter(e => e.from === n.id || e.to === n.id);
    const da = domainOf(col, n), ua = col.util && D.markets[col.mid].utilities[col.util].area;
    const dm = da ? domainMap(da, D.markets[col.mid].country, da !== n.domain_area && ua ? ua.toLowerCase() : null) : "";
    p.innerHTML = `<h3>${nm(n.id)}</h3><div class="dwrap"><dl>
      <dt>Role</dt><dd>${esc(label(C.kind_labels, n.kind))} · ${esc(label(C.jurisdiction_labels, n.jurisdiction))}</dd>
      <dt>What it does</dt><dd>${esc(n.description)}</dd>
      ${g ? `<dt>Term</dt><dd>${esc(g)}</dd>` : ""}
      <dt>Owns</dt><dd>${n.holds_assets && n.holds_assets.length ? esc(n.holds_assets.map(a => a.replace(/_/g, " ")).join(", ")) : "no grid assets entered"}</dd>
      ${n.owner ? `<dt>Owned by</dt><dd>${esc(n.owner.name)} (${esc(n.owner.type.replace(/_/g, " "))}) · ${srcLink(n.owner.source)}</dd>` : ""}
      ${n.source ? `<dt>Source</dt><dd>${srcLink(n.source)}</dd>` : ""}
      ${da ? `<dt>Domain source</dt><dd>${srcLink(da.source)}</dd>` : ""}
      ${lines.length ? `<dt>Lines</dt><dd>${lines.map(e => `${e.from === n.id ? "→ " + nm(e.to) : "← " + nm(e.from)}: ${esc(e.label)} · ${srcLink(e.source)}`).join("<br>")}</dd>` : ""}</dl>${dm}</div>`;
    return p;
  }
  p.innerHTML = `<p class="muted">Select a box or line for details.</p>`;
  return p;
}

/* ---------- toolbar, legend ---------- */
function renderBar() {
  document.querySelectorAll("#lens button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.lens));
  $("#billbar").hidden = S.lens !== "bill";

  if (!comps.includes(S.comp)) S.comp = comps[0];
  const classes = [...new Set(mids.flatMap(mid => country(mid).consumer_classes))];
  const cs = $("#cls"); cs.innerHTML = "";
  classes.forEach(c => cs.add(new Option(c.replace(/_/g, " "), c)));
  cs.value = S.cls; cs.onchange = () => { S.cls = cs.value; render(); };
  const box = $("#comps"); box.innerHTML = "";
  const C0 = country(mids[0]);
  for (const c of comps) {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = label((mids.map(country).find(C => C.component_labels[c]) || C0).component_labels, c);
    if (mids.length > 1 && D.markets[mids[1]].country !== D.markets[mids[0]].country) b.title = label(country(mids[1]).component_labels, c);
    b.setAttribute("aria-pressed", c === S.comp); b.onclick = () => { S.comp = c; render(); };
    box.appendChild(b);
  }
}
function swatch(stroke, shape, dashed) {
  return `<svg viewBox="0 0 34 10"><defs><marker id="lg-${shape}${stroke.length}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="${MARKERS[shape]}" fill="${shape === "hollow" ? "var(--bg)" : stroke}" stroke="${stroke}"/></marker></defs>
    <path d="M1,5 H30" stroke="${stroke}" stroke-width="1.4" ${dashed ? 'stroke-dasharray="4 3"' : ""} marker-end="url(#lg-${shape}${stroke.length})"/></svg>`;
}
function renderLegend() {
  const items = S.lens === "bill"
    ? Object.entries(MODE_SHAPE).map(([m, s]) => [swatch("var(--muted)", s), MODE_TEXT[m]]).concat([[`<svg viewBox="0 0 34 10"><path d="M4,1 h-3 v8 h3 M30,1 h3 v8 h-3" stroke="var(--accent)" fill="none"/></svg>`, "price cap (ceiling)"]])
    : (S.lens === "roles" ? ROLE_TYPES : OWNER_TYPES).map(t => [swatch(`var(--t-${t})`, "arrow"), t.replace(/_/g, " ")]);
  items.push([swatch("var(--muted)", "arrow", true), "needs verification"]);
  $("#legend").innerHTML = items.map(([s, t]) => `<span>${s}${esc(t)}</span>`).join("");
  const n = Object.values(D.markets).flatMap(m => [...(m.base.edges || []), ...Object.values(m.archetypes).flatMap(a => a.edges || [])]);
  $("#foot").textContent = `${n.length} relations entered, ${n.filter(e => e.status !== "verified").length} need verification. Schema v${D.schema_version}.`
    + (D.maps ? " Map shapes: " + [...new Set(Object.values(D.maps).flatMap(m => m.layers.map(l => `${l.credit} (${l.licence.toLowerCase()})`)))].join(", ") + "." : "");
}

function pickUtility(col) {   // default: the first utility offering the current setup, else the first utility
  const utils = col.mid ? Object.entries(D.markets[col.mid].utilities) : [];
  if (!utils.length || D.markets[col.mid].utilities[col.util]) return;
  const [name, u] = utils.find(([, u]) => u.archetypes.includes(col.arch)) || utils[0];
  col.util = name; if (!u.archetypes.includes(col.arch)) col.arch = u.archetypes[0];
}
let lastView = null;
function render() {
  // rebuilding the columns empties the page for a moment; keep the reader's place (page and each diagram's sideways scroll)
  const keep = { x: scrollX, y: scrollY, h: Math.ceil($("#cols").getBoundingClientRect().height), side: [...document.querySelectorAll(".diagram")].map(d => d.scrollLeft) };
  // a new selection in the same diagrams never shortens the page, so the view can't shift; a new diagram resets it
  const view = JSON.stringify([S.lens, S.cols.map(c => [c.mid, c.arch, c.util])]);
  $("#cols").style.minHeight = view === lastView ? keep.h + "px" : "";
  lastView = view;
  S.cols.forEach(c => {
    pickUtility(c);
    if (c.carry) { c.sel = carrySel(c, c.carry); delete c.carry; }
    c.prev = { mid: c.mid, arch: c.arch, util: c.util };
  });
  $("#cols").innerHTML = '<div class="col" id="col0"></div><div class="col" id="col1"></div>';
  W = Math.max(W_MIN, ...S.cols.filter(c => c.mid && c.arch).map(c => {
    const nodes = resolve(c.mid, c.arch).nodes;
    return Math.max(...LANES.map(l => nodes.filter(n => n.lane === l).length)) * (NODE_W + MIN_GAP) + MIN_GAP;
  }));
  renderBar(); renderCol(0); renderCol(1); renderLegend(); saveHash();
  document.querySelectorAll(".diagram").forEach((d, i) => { d.scrollLeft = keep.side[i] || 0; });
  scrollTo(keep.x, keep.y);
}
document.querySelectorAll("#lens button").forEach(b => b.onclick = () => { S.lens = b.dataset.v; S.cols.forEach(c => c.sel = null); render(); });
render();
</script>
